<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gita for Everyday Life</title>
  <meta name="description" content="21 widely loved Bhagavad Gita shlokas with meanings, stories and illustrations for students, homes and workplaces — in English and Kannada.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Serif+Kannada:wght@500;600;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M8 44 A24 24 0 0 1 56 44 Z" fill="#F6B04A"/>
        <g fill="#D9687A" stroke="#9E3B4E" stroke-width="1.5">
          <path d="M32 46 C26 38 27 28 32 20 C37 28 38 38 32 46 Z"/>
          <path d="M32 46 C22 44 16 36 16 28 C24 30 30 38 32 46 Z"/>
          <path d="M32 46 C42 44 48 36 48 28 C40 30 34 38 32 46 Z"/>
        </g>
        <path d="M6 48 H58" stroke="#C9A227" stroke-width="2.5"/>
      </svg>
      <span class="brand-text" data-i18n="siteTitle"></span>
    </a>
    <nav class="nav">
      <a href="#/" data-i18n="navAll"></a>
      <a href="#/about" data-i18n="navAbout"></a>
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language"></button>
      <button class="icon-btn" id="settingsBtn" type="button" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Zm7.4-2.5a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.3 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <p data-i18n="footer"></p>
  </footer>

  <dialog id="settings" class="settings">
    <form method="dialog">
      <h2 data-i18n="settings"></h2>
      <fieldset>
        <legend data-i18n="language"></legend>
        <label><input type="radio" name="lang" value="en"> English</label>
        <label><input type="radio" name="lang" value="kn"> ಕನ್ನಡ</label>
      </fieldset>
      <fieldset>
        <legend data-i18n="scriptLabel"></legend>
        <label><input type="radio" name="script" value="auto"> <span data-i18n="scriptAuto"></span></label>
        <label><input type="radio" name="script" value="devanagari"> <span data-i18n="scriptDevanagari"></span></label>
        <label><input type="radio" name="script" value="roman"> <span data-i18n="scriptRoman"></span></label>
        <label><input type="radio" name="script" value="kannada"> <span data-i18n="scriptKannada"></span></label>
      </fieldset>
      <button class="btn" value="close" data-i18n="done"></button>
    </form>
  </dialog>

  <script src="data/shlokas.js"></script>
  <script src="illustrations.js"></script>
  <script src="app.js"></script>
</body>
</html>
