ref: "9.26"
day: 19
theme: relationships
illustration: humble-offering
related: ["12.13", "17.15", "2.50"]
en:
  title: "A leaf, a flower, a fruit, a little water"
  essence: "It is the love behind the offering that matters, not its cost."
  meaning: >-
    Whoever offers me with devotion a leaf, a flower, a fruit or a little
    water — that offering of love from a pure heart, I accept.
  student: >-
    You don't need money to give. A handwritten thank-you card for a teacher,
    helping a friend understand a topic, or listening to someone who is sad —
    these are offerings of great value.
  home: >-
    A child's clumsy drawing for their mother, a simple meal cooked for a tired
    spouse, a phone call to a lonely grandparent. At home, love is measured in
    attention, not in price tags.
  work: >-
    Recognition doesn't need big budgets. A sincere "thank you, this made a
    difference" to a colleague, specifically and publicly, often means more
    than a gift card.
  story:
    title: "Sudama's handful of rice"
    source: "Bhagavata Purana, Book 10"
    text: >-
      Sudama, Krishna's childhood friend, was very poor. His wife urged him to
      visit Krishna, now king of Dwaraka. With nothing else to bring, Sudama
      carried a handful of flattened rice tied in a cloth, too ashamed to offer
      it. Krishna found it, and ate it with delight as if it were the finest
      feast — and Sudama returned home to find his poverty gone.
    connection: >-
      Krishna did not see the value of the rice; he saw the love of his friend.
  misreading: >-
    "God or people only care about rituals and offerings." No — the verse
    shifts the value from the object to the heart. Without love, even a
    golden offering is empty.
  practice: >-
    Give someone a small, no-cost gift today: a note, a flower, your full
    attention for ten minutes.
kn:
  title: "ಎಲೆ, ಹೂವು, ಹಣ್ಣು, ಸ್ವಲ್ಪ ನೀರು"
  essence: "ಅರ್ಪಣೆಯ ಹಿಂದಿನ ಪ್ರೀತಿಯೇ ಮುಖ್ಯ, ಅದರ ಬೆಲೆಯಲ್ಲ."
  meaning: >-
    ಯಾರು ಭಕ್ತಿಯಿಂದ ನನಗೆ ಎಲೆ, ಹೂವು, ಹಣ್ಣು ಅಥವಾ ನೀರನ್ನು ಅರ್ಪಿಸುತ್ತಾರೋ, ಶುದ್ಧ
    ಮನಸ್ಸಿನವರು ಭಕ್ತಿಯಿಂದ ನೀಡಿದ ಆ ಅರ್ಪಣೆಯನ್ನು ನಾನು ಸ್ವೀಕರಿಸುತ್ತೇನೆ.
  student: >-
    ಕೊಡಲು ಹಣ ಬೇಕಿಲ್ಲ. ಶಿಕ್ಷಕರಿಗೆ ಕೈಬರಹದ ಧನ್ಯವಾದ ಪತ್ರ, ಸ್ನೇಹಿತನಿಗೆ ವಿಷಯ
    ಅರ್ಥಮಾಡಿಸುವುದು, ದುಃಖದಲ್ಲಿರುವವರ ಮಾತು ಕೇಳುವುದು — ಇವು ಅಮೂಲ್ಯ ಅರ್ಪಣೆಗಳು.
  home: >-
    ಮಗು ಅಮ್ಮನಿಗಾಗಿ ಬಿಡಿಸಿದ ಅಸ್ತವ್ಯಸ್ತ ಚಿತ್ರ, ದಣಿದ ಸಂಗಾತಿಗೆ ಮಾಡಿದ ಸರಳ ಅಡುಗೆ,
    ಒಂಟಿಯಾಗಿರುವ ಅಜ್ಜಿಗೆ ಒಂದು ಕರೆ. ಮನೆಯಲ್ಲಿ ಪ್ರೀತಿಯನ್ನು ಗಮನದಿಂದ ಅಳೆಯುತ್ತಾರೆ,
    ಬೆಲೆಯ ಚೀಟಿಯಿಂದಲ್ಲ.
  work: >-
    ಮೆಚ್ಚುಗೆಗೆ ದೊಡ್ಡ ಬಜೆಟ್ ಬೇಕಿಲ್ಲ. ಸಹೋದ್ಯೋಗಿಗೆ ನಿರ್ದಿಷ್ಟವಾಗಿ, ಎಲ್ಲರ ಮುಂದೆ ಹೇಳಿದ
    ಪ್ರಾಮಾಣಿಕ "ಧನ್ಯವಾದ, ಇದರಿಂದ ಬದಲಾವಣೆಯಾಯಿತು" ಅನೇಕ ಬಾರಿ ಉಡುಗೊರೆ ಕಾರ್ಡ್‌ಗಿಂತ ಹೆಚ್ಚು.
  story:
    title: "ಸುದಾಮನ ಹಿಡಿ ಅವಲಕ್ಕಿ"
    source: "ಭಾಗವತ ಪುರಾಣ, ದಶಮ ಸ್ಕಂಧ"
    text: >-
      ಕೃಷ್ಣನ ಬಾಲ್ಯಸ್ನೇಹಿತ ಸುದಾಮ ತುಂಬಾ ಬಡವ. ದ್ವಾರಕೆಯ ರಾಜನಾದ ಕೃಷ್ಣನನ್ನು ಭೇಟಿಯಾಗಲು
      ಅವನ ಹೆಂಡತಿ ಒತ್ತಾಯಿಸಿದಳು. ಬೇರೇನೂ ಇಲ್ಲದೆ, ಬಟ್ಟೆಯಲ್ಲಿ ಕಟ್ಟಿದ ಹಿಡಿ ಅವಲಕ್ಕಿಯನ್ನು
      ಸುದಾಮ ತೆಗೆದುಕೊಂಡು ಹೋದ — ಕೊಡಲು ನಾಚಿಕೆಯಾಯಿತು. ಕೃಷ್ಣ ಅದನ್ನು ಕಂಡು, ಅದೇ ಶ್ರೇಷ್ಠ
      ಭೋಜನವೆಂಬಂತೆ ಸಂತೋಷದಿಂದ ತಿಂದನು — ಮನೆಗೆ ಮರಳಿದ ಸುದಾಮನಿಗೆ ತನ್ನ ಬಡತನ
      ಮಾಯವಾಗಿರುವುದು ಕಂಡಿತು.
    connection: >-
      ಕೃಷ್ಣ ಅವಲಕ್ಕಿಯ ಬೆಲೆಯನ್ನು ನೋಡಲಿಲ್ಲ; ಸ್ನೇಹಿತನ ಪ್ರೀತಿಯನ್ನು ನೋಡಿದ.
  misreading: >-
    "ದೇವರಿಗೆ ಅಥವಾ ಜನರಿಗೆ ಆಚರಣೆ, ಕಾಣಿಕೆಗಳು ಮಾತ್ರ ಮುಖ್ಯ" ಎಂದಲ್ಲ. ಈ ಶ್ಲೋಕ ಮೌಲ್ಯವನ್ನು
    ವಸ್ತುವಿನಿಂದ ಹೃದಯಕ್ಕೆ ವರ್ಗಾಯಿಸುತ್ತದೆ. ಪ್ರೀತಿ ಇಲ್ಲದಿದ್ದರೆ ಚಿನ್ನದ ಕಾಣಿಕೆಯೂ ಖಾಲಿ.
  practice: >-
    ಇಂದು ಯಾರಿಗಾದರೂ ಹಣವಿಲ್ಲದ ಒಂದು ಸಣ್ಣ ಉಡುಗೊರೆ ನೀಡಿ: ಒಂದು ಚೀಟಿ, ಒಂದು ಹೂವು,
    ಹತ್ತು ನಿಮಿಷ ನಿಮ್ಮ ಪೂರ್ಣ ಗಮನ.
