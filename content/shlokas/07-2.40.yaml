ref: "2.40"
day: 7
theme: work
illustration: growing-sprout
related: ["2.47", "6.5", "6.35"]
en:
  title: "No sincere effort is ever wasted"
  essence: "Even a little progress on the right path protects you from great fear."
  meaning: >-
    On this path no effort is lost, and there is no harm or reverse. Even a
    little of this practice protects one from great fear.
  student: >-
    Twenty minutes of revision may not show in tomorrow's test, but it is
    stored. Learning compounds quietly — like a seed that grows roots long
    before a shoot appears.
  home: >-
    Small daily habits — a family meal together, a kind word, saving a little
    each month — seem too small to matter. Over years, they become a family's
    strength in hard times.
  work: >-
    A skill learned "for no reason", a relationship built without an agenda,
    a report done well that nobody praised — sincere effort keeps paying back,
    often when you least expect it.
  story:
    title: "The squirrel at the bridge"
    source: "Folk tradition (popular in South India)"
    text: >-
      As Rama's army built the bridge to Lanka, carrying huge rocks, a small
      squirrel rolled in the sand, ran to the bridge and shook the grains into
      the gaps between the stones — again and again. Some monkeys laughed. Rama
      picked up the squirrel, stroked its back with love, and said its effort
      was as dear to him as anyone's. The stripes on a squirrel's back, the
      story says, are the marks of his fingers.
    connection: >-
      The size of the effort matters less than its sincerity. No honest
      contribution is wasted.
  misreading: >-
    "Any effort will give quick results." No — the verse promises that sincere
    effort is never lost, not that it will pay off immediately.
  practice: >-
    Choose one tiny daily habit (10 minutes of reading, 5 minutes of stretching,
    one phone call to an elder) and do it today — and tomorrow.
kn:
  title: "ಪ್ರಾಮಾಣಿಕ ಪ್ರಯತ್ನ ಎಂದಿಗೂ ವ್ಯರ್ಥವಲ್ಲ"
  essence: "ಸರಿಯಾದ ದಾರಿಯಲ್ಲಿ ಸ್ವಲ್ಪ ಪ್ರಗತಿಯೂ ದೊಡ್ಡ ಭಯದಿಂದ ರಕ್ಷಿಸುತ್ತದೆ."
  meaning: >-
    ಈ ಮಾರ್ಗದಲ್ಲಿ ಆರಂಭಿಸಿದ ಪ್ರಯತ್ನ ನಾಶವಾಗುವುದಿಲ್ಲ, ಯಾವ ಹಾನಿಯೂ ಇಲ್ಲ. ಈ ಧರ್ಮದ
    ಸ್ವಲ್ಪ ಆಚರಣೆಯೂ ಮಹಾ ಭಯದಿಂದ ಕಾಪಾಡುತ್ತದೆ.
  student: >-
    ಇಪ್ಪತ್ತು ನಿಮಿಷದ ಪುನರಾವರ್ತನೆ ನಾಳೆಯ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಕಾಣದಿರಬಹುದು, ಆದರೆ ಅದು
    ಸಂಗ್ರಹವಾಗಿರುತ್ತದೆ. ಕಲಿಕೆ ಮೌನವಾಗಿ ಬೆಳೆಯುತ್ತದೆ — ಮೊಳಕೆ ಕಾಣುವ ಮೊದಲೇ ಬೀಜ
    ಬೇರು ಬಿಡುವಂತೆ.
  home: >-
    ಒಟ್ಟಿಗೆ ಊಟ, ಒಂದು ಪ್ರೀತಿಯ ಮಾತು, ಪ್ರತಿ ತಿಂಗಳು ಸ್ವಲ್ಪ ಉಳಿತಾಯ — ಈ ಸಣ್ಣ ದೈನಂದಿನ
    ಅಭ್ಯಾಸಗಳು ಲೆಕ್ಕಕ್ಕಿಲ್ಲದಂತೆ ಕಾಣುತ್ತವೆ. ವರ್ಷಗಳಲ್ಲಿ ಅವೇ ಕಷ್ಟಕಾಲದಲ್ಲಿ ಕುಟುಂಬದ
    ಬಲವಾಗುತ್ತವೆ.
  work: >-
    "ಸುಮ್ಮನೆ" ಕಲಿತ ಕೌಶಲ, ಸ್ವಾರ್ಥವಿಲ್ಲದೆ ಬೆಳೆಸಿದ ಸಂಬಂಧ, ಯಾರೂ ಹೊಗಳದ ಚೆನ್ನಾಗಿ ಮಾಡಿದ
    ವರದಿ — ಪ್ರಾಮಾಣಿಕ ಪ್ರಯತ್ನ ಅನಿರೀಕ್ಷಿತ ಸಮಯದಲ್ಲಿ ಮರಳಿ ಫಲ ನೀಡುತ್ತಲೇ ಇರುತ್ತದೆ.
  story:
    title: "ಸೇತುವೆಯ ಬಳಿಯ ಅಳಿಲು"
    source: "ಜನಪದ ಕಥೆ (ದಕ್ಷಿಣ ಭಾರತದಲ್ಲಿ ಪ್ರಸಿದ್ಧ)"
    text: >-
      ರಾಮನ ಸೈನ್ಯ ದೊಡ್ಡ ಬಂಡೆಗಳನ್ನು ಹೊತ್ತು ಲಂಕೆಗೆ ಸೇತುವೆ ಕಟ್ಟುತ್ತಿದ್ದಾಗ, ಒಂದು ಪುಟ್ಟ
      ಅಳಿಲು ಮರಳಿನಲ್ಲಿ ಹೊರಳಾಡಿ, ಸೇತುವೆಗೆ ಓಡಿ, ಕಲ್ಲುಗಳ ನಡುವಿನ ಸಂದುಗಳಲ್ಲಿ ಮರಳನ್ನು
      ಕೊಡವುತ್ತಿತ್ತು — ಮತ್ತೆ ಮತ್ತೆ. ಕೆಲವು ಕಪಿಗಳು ನಕ್ಕವು. ರಾಮನು ಅಳಿಲನ್ನು ಕೈಗೆತ್ತಿಕೊಂಡು,
      ಪ್ರೀತಿಯಿಂದ ಅದರ ಬೆನ್ನು ಸವರಿ, ಅದರ ಪ್ರಯತ್ನ ಯಾರದ್ದಕ್ಕಿಂತಲೂ ಕಡಿಮೆಯಲ್ಲ ಎಂದನು.
      ಅಳಿಲಿನ ಬೆನ್ನಿನ ಪಟ್ಟೆಗಳು ಅವನ ಬೆರಳುಗಳ ಗುರುತು ಎಂದು ಕಥೆ ಹೇಳುತ್ತದೆ.
    connection: >-
      ಪ್ರಯತ್ನದ ಗಾತ್ರಕ್ಕಿಂತ ಅದರ ಪ್ರಾಮಾಣಿಕತೆ ಮುಖ್ಯ. ಯಾವ ಪ್ರಾಮಾಣಿಕ ಕೊಡುಗೆಯೂ ವ್ಯರ್ಥವಲ್ಲ.
  misreading: >-
    "ಯಾವ ಪ್ರಯತ್ನಕ್ಕೂ ತಕ್ಷಣ ಫಲ ಸಿಗುತ್ತದೆ" ಎಂದಲ್ಲ. ಪ್ರಾಮಾಣಿಕ ಪ್ರಯತ್ನ ಎಂದಿಗೂ
    ಕಳೆದುಹೋಗುವುದಿಲ್ಲ ಎಂಬುದು ಭರವಸೆ, ತಕ್ಷಣ ಫಲ ಕೊಡುತ್ತದೆ ಎಂಬುದಲ್ಲ.
  practice: >-
    ಒಂದು ಪುಟ್ಟ ದೈನಂದಿನ ಅಭ್ಯಾಸವನ್ನು ಆರಿಸಿ (10 ನಿಮಿಷ ಓದು, 5 ನಿಮಿಷ ವ್ಯಾಯಾಮ,
    ಹಿರಿಯರಿಗೆ ಒಂದು ಕರೆ) — ಇಂದು ಮಾಡಿ, ನಾಳೆಯೂ ಮಾಡಿ.
