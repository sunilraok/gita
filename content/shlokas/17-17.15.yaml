ref: "17.15"
day: 17
theme: relationships
illustration: speech-filter
related: ["12.13", "3.21", "16.21"]
sources:
  story:
    cite: Valmiki Ramayana, Kishkindha Kanda, Sarga 3
    url: https://www.valmikiramayan.net/utf8/kish/sarga3/kishkindhaitrans3.htm
en:
  title: "Speak truly, kindly and helpfully"
  essence: "Words that do not agitate, that are true, pleasant and beneficial — this is the discipline of speech."
  meaning: >-
    Speech that causes no distress, that is truthful, pleasant and beneficial,
    together with the regular study and recitation of sacred texts — this is
    called austerity of speech.
  student: >-
    Before posting a comment or forwarding a message, check: Is it true? Will
    it hurt? Is it kind? Does it help? Cyberbullying and rumours fail all four.
  home: >-
    Most family fights are not about what was said but how. The same truth —
    "you're late again" vs. "I was worried when you didn't call" — can wound or
    heal. Choose words that keep the door open.
  work: >-
    Great feedback is exactly this verse: honest (true), respectful (does not
    agitate), warm (pleasant) and actionable (beneficial). Harsh "honesty" and
    sugar-coated vagueness both fail.
  story:
    title: "Hanuman's first words"
    source: "Valmiki Ramayana, Kishkindha Kanda"
    text: >-
      When Hanuman first met Rama and Lakshmana in the forest, he spoke only a
      few sentences. Rama turned to Lakshmana amazed: this messenger's speech
      had no error, no needless words, no harshness; it was clear, sweet and
      pleasing to the heart. Even an enemy with sword raised, said Rama, would
      be won over by such speech.
    connection: >-
      The right words, spoken well, built one of the greatest friendships in
      the epics.
  misreading: >-
    "Only say pleasant things; hide the truth." No — speech must be true AND
    kind AND helpful. Pleasant lies and cruel truths both fail the test.
  practice: >-
    Before one difficult conversation today, pass your words through the four
    filters: true, not hurtful, pleasant, helpful.
kn:
  title: "ಸತ್ಯವಾಗಿ, ಪ್ರಿಯವಾಗಿ, ಹಿತವಾಗಿ ಮಾತನಾಡು"
  essence: "ಉದ್ವೇಗ ಉಂಟುಮಾಡದ, ಸತ್ಯವಾದ, ಪ್ರಿಯವಾದ, ಹಿತಕರವಾದ ಮಾತು — ಇದೇ ವಾಕ್ ತಪಸ್ಸು."
  meaning: >-
    ಉದ್ವೇಗವನ್ನುಂಟುಮಾಡದ, ಸತ್ಯವಾದ, ಪ್ರಿಯವೂ ಹಿತವೂ ಆದ ಮಾತು ಮತ್ತು ಸ್ವಾಧ್ಯಾಯದ
    ಅಭ್ಯಾಸ — ಇದನ್ನು ವಾಙ್ಮಯ ತಪಸ್ಸು ಎನ್ನುತ್ತಾರೆ.
  student: >-
    ಕಾಮೆಂಟ್ ಹಾಕುವ ಅಥವಾ ಸಂದೇಶ ಫಾರ್ವರ್ಡ್ ಮಾಡುವ ಮುನ್ನ ಪರಿಶೀಲಿಸಿ: ಇದು ಸತ್ಯವೇ?
    ನೋವುಂಟುಮಾಡುತ್ತದೆಯೇ? ದಯೆಯಿಂದ ಕೂಡಿದೆಯೇ? ಉಪಯುಕ್ತವೇ? ಆನ್‌ಲೈನ್ ಕಿರುಕುಳ ಮತ್ತು
    ವದಂತಿಗಳು ನಾಲ್ಕರಲ್ಲೂ ಸೋಲುತ್ತವೆ.
  home: >-
    ಹೆಚ್ಚಿನ ಮನೆಜಗಳಗಳು ಏನು ಹೇಳಿದರು ಎಂಬುದರಿಂದಲ್ಲ, ಹೇಗೆ ಹೇಳಿದರು ಎಂಬುದರಿಂದ. ಒಂದೇ
    ಸತ್ಯ — "ಮತ್ತೆ ತಡವಾಗಿ ಬಂದೆ" ಮತ್ತು "ನೀನು ಕರೆ ಮಾಡದಿದ್ದಾಗ ನನಗೆ ಆತಂಕವಾಯಿತು" —
    ಗಾಯ ಮಾಡಬಹುದು ಅಥವಾ ಗುಣಪಡಿಸಬಹುದು. ಬಾಗಿಲು ತೆರೆದಿಡುವ ಮಾತುಗಳನ್ನು ಆರಿಸಿ.
  work: >-
    ಉತ್ತಮ ಪ್ರತಿಕ್ರಿಯೆ (ಫೀಡ್‌ಬ್ಯಾಕ್) ಎಂದರೆ ಈ ಶ್ಲೋಕವೇ: ಪ್ರಾಮಾಣಿಕ (ಸತ್ಯ), ಗೌರವಯುತ
    (ಉದ್ವೇಗವಿಲ್ಲ), ಆತ್ಮೀಯ (ಪ್ರಿಯ), ಕಾರ್ಯಸಾಧ್ಯ (ಹಿತ). ಕಠೋರ "ಪ್ರಾಮಾಣಿಕತೆ" ಮತ್ತು
    ಸಕ್ಕರೆ ಲೇಪಿತ ಅಸ್ಪಷ್ಟತೆ ಎರಡೂ ವಿಫಲ.
  story:
    title: "ಹನುಮಂತನ ಮೊದಲ ಮಾತುಗಳು"
    source: "ವಾಲ್ಮೀಕಿ ರಾಮಾಯಣ, ಕಿಷ್ಕಿಂಧಾಕಾಂಡ"
    text: >-
      ಕಾಡಿನಲ್ಲಿ ಹನುಮಂತ ಮೊದಲ ಬಾರಿ ರಾಮ-ಲಕ್ಷ್ಮಣರನ್ನು ಭೇಟಿಯಾದಾಗ ಕೆಲವೇ ವಾಕ್ಯಗಳನ್ನು
      ಆಡಿದನು. ರಾಮ ವಿಸ್ಮಯದಿಂದ ಲಕ್ಷ್ಮಣನಿಗೆ ಹೇಳಿದನು: ಈ ದೂತನ ಮಾತಿನಲ್ಲಿ ಯಾವ ದೋಷವೂ
      ಇಲ್ಲ, ಅನಗತ್ಯ ಪದಗಳಿಲ್ಲ, ಕಠೋರತೆ ಇಲ್ಲ; ಅದು ಸ್ಪಷ್ಟ, ಮಧುರ, ಹೃದಯಕ್ಕೆ ಹಿತ. ಕತ್ತಿ
      ಎತ್ತಿದ ಶತ್ರುವೂ ಇಂಥ ಮಾತಿಗೆ ಮನಸೋಲುತ್ತಾನೆ ಎಂದನು ರಾಮ.
    connection: >-
      ಸರಿಯಾಗಿ ಆಡಿದ ಸರಿಯಾದ ಮಾತುಗಳು ಮಹಾಕಾವ್ಯಗಳ ಶ್ರೇಷ್ಠ ಸ್ನೇಹಗಳಲ್ಲಿ ಒಂದನ್ನು ಕಟ್ಟಿದವು.
  misreading: >-
    "ಪ್ರಿಯವಾದುದನ್ನೇ ಹೇಳು; ಸತ್ಯ ಮುಚ್ಚಿಡು" ಎಂದಲ್ಲ. ಮಾತು ಸತ್ಯವೂ, ಪ್ರಿಯವೂ, ಹಿತವೂ
    ಆಗಿರಬೇಕು. ಪ್ರಿಯವಾದ ಸುಳ್ಳು ಮತ್ತು ಕ್ರೂರ ಸತ್ಯ ಎರಡೂ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಸೋಲುತ್ತವೆ.
  practice: >-
    ಇಂದಿನ ಒಂದು ಕಷ್ಟದ ಮಾತುಕತೆಗೆ ಮುನ್ನ, ನಿಮ್ಮ ಮಾತುಗಳನ್ನು ನಾಲ್ಕು ಜರಡಿಗಳ ಮೂಲಕ
    ಹಾಯಿಸಿ: ಸತ್ಯ, ನೋವುಂಟುಮಾಡದ, ಪ್ರಿಯ, ಹಿತ.
