ref: "2.3"
day: 1
theme: courage
illustration: bow-rise
related: ["2.47", "3.35", "18.63"]
en:
  title: "Rise up — don't give in to weakness"
  essence: "Fear shrinks the heart. Stand up and face what is in front of you."
  meaning: >-
    Do not give in to this faint-heartedness — it does not suit you. Shake off
    this petty weakness of the heart and stand up, O conqueror of foes.
  student: >-
    Before a tough exam or a stage performance, the mind invents a hundred
    excuses. Name the fear, then take the first small step — open the book,
    walk up to the mic.
  home: >-
    When a family faces a hard conversation — illness, money trouble, an apology
    that is owed — someone has to go first. Courage at home is often simply
    starting that talk, kindly.
  work: >-
    Speaking up in a meeting, owning a mistake, taking on an unfamiliar project.
    Confidence is not the absence of fear; it is acting well in spite of it.
  story:
    title: "Arjuna lays down his bow"
    source: "Bhagavad Gita, chapters 1–2"
    text: >-
      On the battlefield of Kurukshetra, Arjuna saw his teachers, cousins and
      elders standing in the opposing army. His limbs trembled, his mouth went
      dry, and his great bow Gandiva slipped from his hand. He sank down in the
      chariot and said, "I will not fight." Krishna did not mock his fear. He
      reminded Arjuna who he was — and then spent the rest of the Gita helping
      him see clearly.
    connection: >-
      The Gita begins with a very human breakdown. Everyone has a "Kurukshetra
      moment". The first step out of it is simply to stand up.
  misreading: >-
    "Never feel fear or sadness." No — Arjuna's feelings were real. The verse
    asks us not to let weakness make our decisions.
  practice: >-
    Pick one thing you have been avoiding out of fear. Do just the first five
    minutes of it today.
kn:
  title: "ಎದ್ದೇಳು — ದೌರ್ಬಲ್ಯಕ್ಕೆ ಮಣಿಯಬೇಡ"
  essence: "ಭಯ ಹೃದಯವನ್ನು ಕುಗ್ಗಿಸುತ್ತದೆ. ಎದ್ದು ನಿಂತು ಎದುರಿನ ಸವಾಲನ್ನು ಎದುರಿಸು."
  meaning: >-
    ಈ ಹೇಡಿತನಕ್ಕೆ ಒಳಗಾಗಬೇಡ, ಇದು ನಿನಗೆ ತಕ್ಕದ್ದಲ್ಲ. ಹೃದಯದ ಈ ಕ್ಷುದ್ರ
    ದೌರ್ಬಲ್ಯವನ್ನು ತೊರೆದು ಎದ್ದೇಳು, ಓ ಶತ್ರುಗಳನ್ನು ತಪಿಸುವವನೇ.
  student: >-
    ಕಠಿಣ ಪರೀಕ್ಷೆ ಅಥವಾ ವೇದಿಕೆಯ ಪ್ರದರ್ಶನಕ್ಕೆ ಮುನ್ನ ಮನಸ್ಸು ನೂರು ನೆಪಗಳನ್ನು
    ಹುಡುಕುತ್ತದೆ. ಭಯವನ್ನು ಗುರುತಿಸಿ, ಮೊದಲ ಸಣ್ಣ ಹೆಜ್ಜೆ ಇಡಿ — ಪುಸ್ತಕ ತೆರೆಯಿರಿ,
    ಮೈಕ್ ಬಳಿ ನಡೆಯಿರಿ.
  home: >-
    ಅನಾರೋಗ್ಯ, ಹಣದ ತೊಂದರೆ, ಕೇಳಬೇಕಾದ ಕ್ಷಮೆ — ಇಂಥ ಕಷ್ಟದ ಮಾತುಕತೆಯನ್ನು ಮನೆಯಲ್ಲಿ
    ಯಾರಾದರೂ ಮೊದಲು ಆರಂಭಿಸಬೇಕು. ಮನೆಯಲ್ಲಿ ಧೈರ್ಯ ಎಂದರೆ ಅನೇಕ ಬಾರಿ ಪ್ರೀತಿಯಿಂದ
    ಆ ಮಾತನ್ನು ಶುರುಮಾಡುವುದು.
  work: >-
    ಸಭೆಯಲ್ಲಿ ಅಭಿಪ್ರಾಯ ಹೇಳುವುದು, ತಪ್ಪನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುವುದು, ಪರಿಚಯವಿಲ್ಲದ ಕೆಲಸವನ್ನು
    ಕೈಗೆತ್ತಿಕೊಳ್ಳುವುದು. ಆತ್ಮವಿಶ್ವಾಸ ಎಂದರೆ ಭಯವಿಲ್ಲದಿರುವುದಲ್ಲ; ಭಯವಿದ್ದರೂ
    ಸರಿಯಾಗಿ ನಡೆದುಕೊಳ್ಳುವುದು.
  story:
    title: "ಅರ್ಜುನ ಬಿಲ್ಲನ್ನು ಕೆಳಗಿಟ್ಟಾಗ"
    source: "ಭಗವದ್ಗೀತೆ, ಅಧ್ಯಾಯ 1–2"
    text: >-
      ಕುರುಕ್ಷೇತ್ರದ ರಣಭೂಮಿಯಲ್ಲಿ ಎದುರಾಳಿ ಸೈನ್ಯದಲ್ಲಿ ತನ್ನ ಗುರುಗಳು, ಬಂಧುಗಳು,
      ಹಿರಿಯರು ನಿಂತಿರುವುದನ್ನು ಅರ್ಜುನ ಕಂಡನು. ಅವನ ಕೈಕಾಲು ನಡುಗಿತು, ಬಾಯಿ ಒಣಗಿತು,
      ಗಾಂಡೀವ ಕೈಯಿಂದ ಜಾರಿತು. ರಥದಲ್ಲಿ ಕುಸಿದು ಕುಳಿತು "ನಾನು ಯುದ್ಧ ಮಾಡುವುದಿಲ್ಲ"
      ಎಂದನು. ಕೃಷ್ಣ ಅವನ ಭಯವನ್ನು ಹಂಗಿಸಲಿಲ್ಲ. ಅವನು ಯಾರು ಎಂಬುದನ್ನು ನೆನಪಿಸಿದನು —
      ನಂತರ ಇಡೀ ಗೀತೆಯುದ್ದಕ್ಕೂ ಅವನಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ ನೋಡಲು ನೆರವಾದನು.
    connection: >-
      ಗೀತೆ ಆರಂಭವಾಗುವುದೇ ಒಂದು ಮಾನವೀಯ ಕುಸಿತದಿಂದ. ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ತಮ್ಮದೇ
      "ಕುರುಕ್ಷೇತ್ರದ ಕ್ಷಣ" ಇರುತ್ತದೆ. ಅದರಿಂದ ಹೊರಬರುವ ಮೊದಲ ಹೆಜ್ಜೆ — ಎದ್ದು ನಿಲ್ಲುವುದು.
  misreading: >-
    "ಎಂದಿಗೂ ಭಯ ಅಥವಾ ದುಃಖ ಪಡಬೇಡ" ಎಂದಲ್ಲ. ಅರ್ಜುನನ ಭಾವನೆಗಳು ನಿಜವಾಗಿದ್ದವು.
    ದೌರ್ಬಲ್ಯವು ನಮ್ಮ ನಿರ್ಧಾರಗಳನ್ನು ಮಾಡಬಾರದು ಎಂಬುದೇ ಇಲ್ಲಿನ ಸಂದೇಶ.
  practice: >-
    ಭಯದಿಂದ ಮುಂದೂಡುತ್ತಿರುವ ಒಂದು ಕೆಲಸವನ್ನು ಆರಿಸಿ. ಇಂದು ಅದರ ಮೊದಲ ಐದು ನಿಮಿಷ
    ಮಾತ್ರ ಮಾಡಿ.
