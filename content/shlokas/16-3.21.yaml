ref: "3.21"
day: 16
theme: relationships
illustration: footsteps
related: ["17.15", "2.50", "6.5"]
sources:
  story:
    cite: Popular anecdote attributed to Gandhi; no primary source has been found
en:
  title: "People follow what you do"
  essence: "Whatever a leader does, others follow. Lead by example."
  meaning: >-
    Whatever a great person does, others imitate. Whatever standard they set,
    the world follows.
  student: >-
    Seniors in school and college set the culture — for ragging or for
    kindness, for copying or for honest effort. Younger students are
    watching you, even when you don't notice.
  home: >-
    Children learn far more from what parents do than from what they say.
    A parent who reads, apologises, keeps promises and speaks respectfully
    to the house help is teaching every day, without a lecture.
  work: >-
    Teams copy their leader's real behaviour: if the manager cuts corners,
    so will the team; if the manager admits mistakes, the team will too.
    Culture is what leaders do when it's inconvenient.
  story:
    title: "Gandhi and the sugar"
    source: "Popular anecdote attributed to Mahatma Gandhi"
    text: >-
      A mother brought her son to Gandhi and asked him to tell the boy to stop
      eating so much sugar. Gandhi asked her to come back in two weeks. When
      they returned, he told the boy gently to stop. The puzzled mother asked
      why he had not said this the first time. Gandhi replied, "Two weeks ago,
      I was still eating sugar myself."
    connection: >-
      Whether or not every detail is historical, the point is timeless: advice
      carries weight only when the adviser lives it.
  misreading: >-
    "Only famous people or bosses are role models." No — "śreṣṭha" is anyone
    others look up to: an elder sibling, a parent, a senior, a friend.
  practice: >-
    Pick one habit you want to see in your children, juniors or team. Practise
    it visibly yourself for a week before you mention it.
kn:
  title: "ನೀನು ಮಾಡುವುದನ್ನೇ ಜನ ಅನುಸರಿಸುತ್ತಾರೆ"
  essence: "ಶ್ರೇಷ್ಠರು ಏನು ಮಾಡುತ್ತಾರೋ ಅದನ್ನೇ ಇತರರು ಅನುಸರಿಸುತ್ತಾರೆ. ಉದಾಹರಣೆಯಿಂದ ಮುನ್ನಡೆಸು."
  meaning: >-
    ಶ್ರೇಷ್ಠನು ಯಾವುದನ್ನು ಆಚರಿಸುತ್ತಾನೋ ಅದನ್ನೇ ಇತರ ಜನರೂ ಆಚರಿಸುತ್ತಾರೆ. ಅವನು
    ಯಾವ ಮಾನದಂಡವನ್ನು ಹಾಕುತ್ತಾನೋ ಲೋಕ ಅದನ್ನೇ ಅನುಸರಿಸುತ್ತದೆ.
  student: >-
    ಶಾಲೆ-ಕಾಲೇಜಿನ ಹಿರಿಯ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಂಸ್ಕೃತಿಯನ್ನು ರೂಪಿಸುತ್ತಾರೆ — ರ‍್ಯಾಗಿಂಗ್‌ಗೋ
    ದಯೆಗೋ, ನಕಲಿಗೋ ಪ್ರಾಮಾಣಿಕ ಪ್ರಯತ್ನಕ್ಕೋ. ನೀವು ಗಮನಿಸದಿದ್ದರೂ ಕಿರಿಯರು ನಿಮ್ಮನ್ನು
    ನೋಡುತ್ತಿರುತ್ತಾರೆ.
  home: >-
    ಮಕ್ಕಳು ತಂದೆ-ತಾಯಿ ಹೇಳುವುದಕ್ಕಿಂತ ಮಾಡುವುದರಿಂದ ಹೆಚ್ಚು ಕಲಿಯುತ್ತಾರೆ. ಓದುವ, ಕ್ಷಮೆ
    ಕೇಳುವ, ಮಾತು ಉಳಿಸಿಕೊಳ್ಳುವ, ಮನೆಗೆಲಸದವರೊಂದಿಗೂ ಗೌರವದಿಂದ ಮಾತನಾಡುವ ಪೋಷಕರು
    ಉಪದೇಶವಿಲ್ಲದೆಯೇ ಪ್ರತಿದಿನ ಕಲಿಸುತ್ತಿರುತ್ತಾರೆ.
  work: >-
    ತಂಡಗಳು ನಾಯಕನ ನಿಜವಾದ ನಡವಳಿಕೆಯನ್ನು ನಕಲು ಮಾಡುತ್ತವೆ: ಮ್ಯಾನೇಜರ್ ಅಡ್ಡದಾರಿ ಹಿಡಿದರೆ
    ತಂಡವೂ ಹಿಡಿಯುತ್ತದೆ; ಮ್ಯಾನೇಜರ್ ತಪ್ಪು ಒಪ್ಪಿಕೊಂಡರೆ ತಂಡವೂ ಒಪ್ಪುತ್ತದೆ. ಅನಾನುಕೂಲವಾದಾಗ
    ನಾಯಕರು ಏನು ಮಾಡುತ್ತಾರೋ ಅದೇ ಸಂಸ್ಕೃತಿ.
  story:
    title: "ಗಾಂಧೀಜಿ ಮತ್ತು ಸಕ್ಕರೆ"
    source: "ಮಹಾತ್ಮ ಗಾಂಧೀಜಿಗೆ ಆರೋಪಿಸಲಾದ ಜನಪ್ರಿಯ ಪ್ರಸಂಗ"
    text: >-
      ಒಬ್ಬ ತಾಯಿ ತನ್ನ ಮಗನನ್ನು ಗಾಂಧೀಜಿಯ ಬಳಿ ಕರೆತಂದು, ಹೆಚ್ಚು ಸಕ್ಕರೆ ತಿನ್ನಬೇಡ ಎಂದು
      ಅವನಿಗೆ ಹೇಳಲು ಕೇಳಿದಳು. ಎರಡು ವಾರ ಬಿಟ್ಟು ಬನ್ನಿ ಎಂದರು ಗಾಂಧೀಜಿ. ಮರಳಿ ಬಂದಾಗ ಅವರು
      ಹುಡುಗನಿಗೆ ಮೃದುವಾಗಿ ತಿಳಿಹೇಳಿದರು. ಮೊದಲ ಬಾರಿಯೇ ಏಕೆ ಹೇಳಲಿಲ್ಲ ಎಂದು ತಾಯಿ
      ಕೇಳಿದಾಗ ಗಾಂಧೀಜಿ ಹೇಳಿದರು: "ಎರಡು ವಾರಗಳ ಹಿಂದೆ ನಾನೇ ಸಕ್ಕರೆ ತಿನ್ನುತ್ತಿದ್ದೆ."
    connection: >-
      ಪ್ರತಿಯೊಂದು ವಿವರ ಐತಿಹಾಸಿಕವೋ ಅಲ್ಲವೋ, ಸಂದೇಶ ಕಾಲಾತೀತ: ಸಲಹೆ ನೀಡುವವರು ಅದನ್ನು
      ಬದುಕಿದಾಗ ಮಾತ್ರ ಅದಕ್ಕೆ ತೂಕ.
  misreading: >-
    "ಪ್ರಸಿದ್ಧರು ಅಥವಾ ಮೇಲಧಿಕಾರಿಗಳು ಮಾತ್ರ ಮಾದರಿ" ಎಂದಲ್ಲ. "ಶ್ರೇಷ್ಠ" ಎಂದರೆ ಇತರರು
    ಗೌರವದಿಂದ ನೋಡುವ ಯಾರಾದರೂ: ಅಣ್ಣ-ಅಕ್ಕ, ಪೋಷಕರು, ಹಿರಿಯರು, ಸ್ನೇಹಿತರು.
  practice: >-
    ನಿಮ್ಮ ಮಕ್ಕಳು, ಕಿರಿಯರು ಅಥವಾ ತಂಡದಲ್ಲಿ ನೋಡಬಯಸುವ ಒಂದು ಅಭ್ಯಾಸವನ್ನು ಆರಿಸಿ. ಅದರ
    ಬಗ್ಗೆ ಹೇಳುವ ಮೊದಲು ಒಂದು ವಾರ ನೀವೇ ಅದನ್ನು ಎಲ್ಲರಿಗೂ ಕಾಣುವಂತೆ ಆಚರಿಸಿ.
