ref: "4.34"
day: 15
theme: learning
illustration: three-pillars
related: ["2.7", "6.5", "18.63"]
en:
  title: "Learn with humility, questions and service"
  essence: "Approach a teacher humbly, ask sincere questions, and serve — and knowledge will be shared with you."
  meaning: >-
    Learn the truth by approaching those who know: bow to them in humility,
    ask them sincere questions, and serve them. The wise, who have seen the
    truth, will teach you.
  student: >-
    Three habits of great learners: humility (admitting "I don't know"),
    curiosity (asking real questions, not just for marks), and service
    (helping the teacher and classmates). Teachers open up to such students.
  home: >-
    Grandparents hold decades of experience. Sit with them, ask how they
    handled hard times, help them with something — you'll receive wisdom no
    book contains.
  work: >-
    Find mentors. Approach senior colleagues with respect, come with specific
    questions, and offer help on their projects. Mentorship flows toward
    people who are humble, curious and useful.
  story:
    title: "Nachiketa at the door of Death"
    source: "Katha Upanishad"
    text: >-
      The boy Nachiketa went to the house of Yama, the lord of death, and
      waited three days at the door without food. Pleased, Yama offered three
      boons. Nachiketa refused wealth, long life and pleasures, and asked the
      one question that mattered: "What happens after death — what is the
      self?" Tested and found sincere, he was taught the highest knowledge.
    connection: >-
      Patience (humility), the right question, and sincerity (service) opened
      the door to wisdom — exactly the three steps of this verse.
  misreading: >-
    "Blindly obey any teacher." No — "paripraśna" means questioning deeply.
    The Gita wants questions, and at the end (18.63) asks you to reflect for
    yourself.
  practice: >-
    Write one real question you have about your studies, work or life. Ask it
    today to someone who knows more than you — and thank them.
kn:
  title: "ನಮ್ರತೆ, ಪ್ರಶ್ನೆ ಮತ್ತು ಸೇವೆಯಿಂದ ಕಲಿ"
  essence: "ನಮ್ರತೆಯಿಂದ ಗುರುವನ್ನು ಸಮೀಪಿಸು, ಪ್ರಾಮಾಣಿಕ ಪ್ರಶ್ನೆ ಕೇಳು, ಸೇವೆ ಮಾಡು — ಜ್ಞಾನ ನಿನಗೆ ದೊರೆಯುತ್ತದೆ."
  meaning: >-
    ತತ್ತ್ವವನ್ನು ಅರಿತವರ ಬಳಿ ಹೋಗಿ ಅದನ್ನು ತಿಳಿ — ನಮ್ರತೆಯಿಂದ ನಮಸ್ಕರಿಸಿ, ಪ್ರಾಮಾಣಿಕ
    ಪ್ರಶ್ನೆಗಳನ್ನು ಕೇಳಿ, ಸೇವೆ ಮಾಡಿ. ತತ್ತ್ವದರ್ಶಿಗಳಾದ ಜ್ಞಾನಿಗಳು ನಿನಗೆ ಜ್ಞಾನವನ್ನು ಉಪದೇಶಿಸುತ್ತಾರೆ.
  student: >-
    ಶ್ರೇಷ್ಠ ಕಲಿಕಾರರ ಮೂರು ಅಭ್ಯಾಸಗಳು: ನಮ್ರತೆ ("ನನಗೆ ಗೊತ್ತಿಲ್ಲ" ಎಂದು ಒಪ್ಪುವುದು),
    ಕುತೂಹಲ (ಅಂಕಕ್ಕಾಗಿ ಮಾತ್ರವಲ್ಲ, ನಿಜವಾದ ಪ್ರಶ್ನೆ ಕೇಳುವುದು), ಮತ್ತು ಸೇವೆ (ಶಿಕ್ಷಕರು,
    ಸಹಪಾಠಿಗಳಿಗೆ ನೆರವಾಗುವುದು). ಇಂಥ ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಶಿಕ್ಷಕರು ಮನಸ್ಸು ತೆರೆಯುತ್ತಾರೆ.
  home: >-
    ಅಜ್ಜ-ಅಜ್ಜಿಯರ ಬಳಿ ದಶಕಗಳ ಅನುಭವವಿದೆ. ಅವರೊಂದಿಗೆ ಕುಳಿತು, ಕಷ್ಟಕಾಲವನ್ನು ಹೇಗೆ
    ನಿಭಾಯಿಸಿದರು ಎಂದು ಕೇಳಿ, ಏನಾದರೂ ಕೆಲಸದಲ್ಲಿ ನೆರವಾಗಿ — ಯಾವ ಪುಸ್ತಕದಲ್ಲೂ ಇಲ್ಲದ
    ಜ್ಞಾನ ನಿಮಗೆ ದೊರೆಯುತ್ತದೆ.
  work: >-
    ಮಾರ್ಗದರ್ಶಕರನ್ನು ಹುಡುಕಿ. ಹಿರಿಯ ಸಹೋದ್ಯೋಗಿಗಳನ್ನು ಗೌರವದಿಂದ ಸಮೀಪಿಸಿ, ನಿರ್ದಿಷ್ಟ
    ಪ್ರಶ್ನೆಗಳೊಂದಿಗೆ ಹೋಗಿ, ಅವರ ಪ್ರಾಜೆಕ್ಟ್‌ಗಳಲ್ಲಿ ನೆರವು ನೀಡಿ. ನಮ್ರ, ಕುತೂಹಲಿ, ಉಪಯುಕ್ತ
    ವ್ಯಕ್ತಿಗಳತ್ತ ಮಾರ್ಗದರ್ಶನ ಹರಿಯುತ್ತದೆ.
  story:
    title: "ಯಮನ ಬಾಗಿಲಲ್ಲಿ ನಚಿಕೇತ"
    source: "ಕಠೋಪನಿಷತ್"
    text: >-
      ಬಾಲಕ ನಚಿಕೇತ ಮೃತ್ಯುದೇವ ಯಮನ ಮನೆಗೆ ಹೋಗಿ, ಮೂರು ದಿನ ಆಹಾರವಿಲ್ಲದೆ ಬಾಗಿಲಲ್ಲಿ ಕಾದನು.
      ಸಂತುಷ್ಟನಾದ ಯಮ ಮೂರು ವರಗಳನ್ನು ನೀಡಿದನು. ನಚಿಕೇತ ಸಂಪತ್ತು, ದೀರ್ಘಾಯುಷ್ಯ, ಭೋಗಗಳನ್ನು
      ನಿರಾಕರಿಸಿ, ಮುಖ್ಯವಾದ ಒಂದೇ ಪ್ರಶ್ನೆ ಕೇಳಿದನು: "ಮರಣದ ನಂತರ ಏನಾಗುತ್ತದೆ — ಆತ್ಮ
      ಎಂದರೇನು?" ಪರೀಕ್ಷಿಸಿ ಪ್ರಾಮಾಣಿಕನೆಂದು ಕಂಡ ಯಮ ಅವನಿಗೆ ಪರಮ ಜ್ಞಾನವನ್ನು ಉಪದೇಶಿಸಿದನು.
    connection: >-
      ತಾಳ್ಮೆ (ನಮ್ರತೆ), ಸರಿಯಾದ ಪ್ರಶ್ನೆ, ಮತ್ತು ಪ್ರಾಮಾಣಿಕತೆ (ಸೇವಾಭಾವ) ಜ್ಞಾನದ ಬಾಗಿಲು
      ತೆರೆದವು — ಈ ಶ್ಲೋಕದ ಮೂರು ಹೆಜ್ಜೆಗಳೇ ಇವು.
  misreading: >-
    "ಯಾವ ಗುರುವನ್ನಾದರೂ ಕುರುಡಾಗಿ ಅನುಸರಿಸು" ಎಂದಲ್ಲ. "ಪರಿಪ್ರಶ್ನ" ಎಂದರೆ ಆಳವಾಗಿ
    ಪ್ರಶ್ನಿಸುವುದು. ಗೀತೆ ಪ್ರಶ್ನೆಗಳನ್ನು ಬಯಸುತ್ತದೆ, ಕೊನೆಯಲ್ಲಿ (18.63) ನೀವೇ ವಿಮರ್ಶಿಸಿ ಎನ್ನುತ್ತದೆ.
  practice: >-
    ನಿಮ್ಮ ಓದು, ಕೆಲಸ ಅಥವಾ ಬದುಕಿನ ಬಗ್ಗೆ ಒಂದು ನಿಜವಾದ ಪ್ರಶ್ನೆ ಬರೆಯಿರಿ. ನಿಮಗಿಂತ
    ಹೆಚ್ಚು ತಿಳಿದವರನ್ನು ಇಂದೇ ಕೇಳಿ — ಮತ್ತು ಧನ್ಯವಾದ ಹೇಳಿ.
