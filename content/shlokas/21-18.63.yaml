ref: "18.63"
day: 21
theme: life
illustration: reflect-choose
related: ["4.34", "2.3", "3.35"]
en:
  title: "Reflect fully, then choose freely"
  essence: "After all the teaching, the choice is yours. Think it through, then act."
  meaning: >-
    Thus I have explained to you this wisdom, more secret than all secrets.
    Reflect on it fully, and then do as you choose.
  student: >-
    Parents, teachers, relatives and the internet will all give you advice
    about your future. Listen well — then think it through yourself. A choice
    you understand is one you can commit to.
  home: >-
    Parents can guide, share values and explain consequences — and then trust
    their grown children to decide. Respecting their freedom is itself a
    teaching.
  work: >-
    Good leaders explain the reasoning and the context, then let their people
    decide how to act. Ownership grows where people are trusted to think.
  story:
    title: "Arjuna's decision"
    source: "Bhagavad Gita 18.63–73"
    text: >-
      After seven hundred verses, Krishna did not command Arjuna to fight. He
      said, "I have told you everything. Reflect deeply, and do what you
      choose." Arjuna thought, and answered: "My confusion is gone. I have
      regained my clarity by your grace. I stand firm, free of doubt. I will
      act on your word."
    connection: >-
      The Gita began with a man too confused to act. It ends with the same man
      choosing freely, with clarity. That journey is the whole point.
  misreading: >-
    "Do whatever you feel like." No — the verse says reflect fully first
    (vimṛśya aśeṣeṇa). Freedom follows understanding, not impulse.
  practice: >-
    Take one decision you are facing. Write the advice you've received, your
    own reasoning, and then your choice. Own it.
kn:
  title: "ಸಂಪೂರ್ಣವಾಗಿ ವಿಮರ್ಶಿಸು, ನಂತರ ಸ್ವತಂತ್ರವಾಗಿ ಆರಿಸು"
  essence: "ಎಲ್ಲಾ ಉಪದೇಶದ ನಂತರ ಆಯ್ಕೆ ನಿನ್ನದು. ಆಳವಾಗಿ ಯೋಚಿಸಿ, ನಂತರ ಕಾರ್ಯ ಮಾಡು."
  meaning: >-
    ಹೀಗೆ ರಹಸ್ಯಗಳಲ್ಲೇ ರಹಸ್ಯವಾದ ಈ ಜ್ಞಾನವನ್ನು ನಾನು ನಿನಗೆ ಹೇಳಿದ್ದೇನೆ. ಇದನ್ನು
    ಸಂಪೂರ್ಣವಾಗಿ ವಿಮರ್ಶಿಸಿ, ನಂತರ ನಿನಗೆ ಇಷ್ಟವಾದಂತೆ ಮಾಡು.
  student: >-
    ಪೋಷಕರು, ಶಿಕ್ಷಕರು, ಸಂಬಂಧಿಕರು, ಅಂತರ್ಜಾಲ — ಎಲ್ಲರೂ ನಿಮ್ಮ ಭವಿಷ್ಯದ ಬಗ್ಗೆ ಸಲಹೆ
    ನೀಡುತ್ತಾರೆ. ಚೆನ್ನಾಗಿ ಆಲಿಸಿ — ನಂತರ ನೀವೇ ಯೋಚಿಸಿ. ಅರ್ಥಮಾಡಿಕೊಂಡ ಆಯ್ಕೆಗೆ ಮಾತ್ರ
    ನೀವು ಬದ್ಧರಾಗಬಲ್ಲಿರಿ.
  home: >-
    ಪೋಷಕರು ಮಾರ್ಗದರ್ಶನ ನೀಡಬಹುದು, ಮೌಲ್ಯಗಳನ್ನು ಹಂಚಿಕೊಳ್ಳಬಹುದು, ಪರಿಣಾಮಗಳನ್ನು
    ವಿವರಿಸಬಹುದು — ನಂತರ ಬೆಳೆದ ಮಕ್ಕಳ ನಿರ್ಧಾರದಲ್ಲಿ ನಂಬಿಕೆ ಇಡಬೇಕು. ಅವರ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು
    ಗೌರವಿಸುವುದೇ ಒಂದು ಪಾಠ.
  work: >-
    ಉತ್ತಮ ನಾಯಕರು ಕಾರಣ ಮತ್ತು ಸಂದರ್ಭವನ್ನು ವಿವರಿಸಿ, ನಂತರ ಹೇಗೆ ಕಾರ್ಯ ಮಾಡಬೇಕೆಂದು
    ತಂಡಕ್ಕೆ ನಿರ್ಧರಿಸಲು ಬಿಡುತ್ತಾರೆ. ಯೋಚಿಸಲು ನಂಬಿಕೆ ಇಟ್ಟಲ್ಲಿ ಹೊಣೆಗಾರಿಕೆ ಬೆಳೆಯುತ್ತದೆ.
  story:
    title: "ಅರ್ಜುನನ ನಿರ್ಧಾರ"
    source: "ಭಗವದ್ಗೀತೆ 18.63–73"
    text: >-
      ಏಳುನೂರು ಶ್ಲೋಕಗಳ ನಂತರವೂ ಕೃಷ್ಣ ಅರ್ಜುನನಿಗೆ ಯುದ್ಧ ಮಾಡು ಎಂದು ಆಜ್ಞಾಪಿಸಲಿಲ್ಲ.
      "ಎಲ್ಲವನ್ನೂ ಹೇಳಿದ್ದೇನೆ. ಆಳವಾಗಿ ವಿಮರ್ಶಿಸಿ, ನಿನಗೆ ತೋಚಿದಂತೆ ಮಾಡು" ಎಂದನು. ಅರ್ಜುನ
      ಯೋಚಿಸಿ ಉತ್ತರಿಸಿದ: "ನನ್ನ ಮೋಹ ನಾಶವಾಯಿತು. ನಿನ್ನ ಕೃಪೆಯಿಂದ ಸ್ಮೃತಿ ಮರಳಿ ಬಂದಿದೆ.
      ಸಂಶಯವಿಲ್ಲದೆ ದೃಢವಾಗಿ ನಿಂತಿದ್ದೇನೆ. ನಿನ್ನ ಮಾತಿನಂತೆ ಮಾಡುತ್ತೇನೆ."
    connection: >-
      ಕಾರ್ಯ ಮಾಡಲಾಗದಷ್ಟು ಗೊಂದಲದಲ್ಲಿದ್ದ ವ್ಯಕ್ತಿಯಿಂದ ಗೀತೆ ಆರಂಭವಾಯಿತು. ಅದೇ ವ್ಯಕ್ತಿ
      ಸ್ಪಷ್ಟತೆಯಿಂದ ಸ್ವತಂತ್ರವಾಗಿ ಆರಿಸುವುದರೊಂದಿಗೆ ಮುಗಿಯುತ್ತದೆ. ಆ ಪಯಣವೇ ಗೀತೆಯ ಸಾರ.
  misreading: >-
    "ಮನಸ್ಸಿಗೆ ಬಂದಂತೆ ಮಾಡು" ಎಂದಲ್ಲ. ಮೊದಲು ಸಂಪೂರ್ಣವಾಗಿ ವಿಮರ್ಶಿಸು (ವಿಮೃಶ್ಯ ಅಶೇಷೇಣ)
    ಎನ್ನುತ್ತದೆ ಶ್ಲೋಕ. ಸ್ವಾತಂತ್ರ್ಯ ತಿಳಿವಳಿಕೆಯನ್ನು ಅನುಸರಿಸುತ್ತದೆ, ಆವೇಶವನ್ನಲ್ಲ.
  practice: >-
    ನೀವು ಎದುರಿಸುತ್ತಿರುವ ಒಂದು ನಿರ್ಧಾರವನ್ನು ತೆಗೆದುಕೊಳ್ಳಿ. ನಿಮಗೆ ಸಿಕ್ಕ ಸಲಹೆ, ನಿಮ್ಮ
    ಸ್ವಂತ ತರ್ಕ, ನಂತರ ನಿಮ್ಮ ಆಯ್ಕೆಯನ್ನು ಬರೆಯಿರಿ. ಅದರ ಹೊಣೆ ಹೊತ್ತುಕೊಳ್ಳಿ.
