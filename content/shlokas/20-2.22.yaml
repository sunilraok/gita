ref: "2.22"
day: 20
theme: life
illustration: old-new-clothes
related: ["2.14", "2.56", "18.63"]
en:
  title: "Like changing old clothes"
  essence: "As we discard worn-out clothes for new ones, the self moves on from a worn-out body."
  meaning: >-
    Just as a person casts off worn-out garments and puts on new ones, so the
    embodied self casts off worn-out bodies and enters new ones.
  student: >-
    Losing a grandparent is often a young person's first meeting with death.
    This verse offers a gentle way to understand it: the person you loved was
    more than the body you saw. Their values live on in you.
  home: >-
    When a family grieves, this verse doesn't forbid tears — Arjuna's grief
    was real. It offers perspective: what was essential in the one we lost is
    not destroyed. Families often find comfort in reciting it together.
  work: >-
    Change also "dies and is reborn" at work: a role ends, a team dissolves,
    a company closes. Your skills, character and relationships — the real you —
    carry forward into the next "garment".
  story:
    title: "The Yaksha's question"
    source: "Mahabharata, Vana Parva"
    text: >-
      A Yaksha (nature spirit) guarding a lake asked Yudhishthira many riddles
      before he could drink. One was: "What is the greatest wonder?"
      Yudhishthira answered: "Every day, countless beings go to the house of
      death; yet those who remain behave as if they will live forever. What
      could be more wonderful than this?"
    connection: >-
      Remembering that bodies change helps us live well now: to forgive
      sooner, love more openly, and hold things more lightly.
  misreading: >-
    "Death doesn't matter, so don't grieve." No — the Gita acknowledges
    grief; it helps us bear it with understanding and continue our duties.
  practice: >-
    Think of someone you have lost. Write down one quality of theirs you
    want to carry forward — and act on it once today.
kn:
  title: "ಹಳೆಯ ಬಟ್ಟೆ ಬದಲಿಸಿದಂತೆ"
  essence: "ಹಳೆಯ ಬಟ್ಟೆ ಬಿಟ್ಟು ಹೊಸದನ್ನು ತೊಡುವಂತೆ, ಆತ್ಮವು ಜೀರ್ಣವಾದ ದೇಹವನ್ನು ಬಿಟ್ಟು ಮುಂದುವರಿಯುತ್ತದೆ."
  meaning: >-
    ಮನುಷ್ಯನು ಹಳೆಯ ಬಟ್ಟೆಗಳನ್ನು ಬಿಟ್ಟು ಹೊಸ ಬಟ್ಟೆಗಳನ್ನು ಧರಿಸುವಂತೆ, ದೇಹಧಾರಿಯಾದ
    ಆತ್ಮವು ಜೀರ್ಣವಾದ ದೇಹಗಳನ್ನು ಬಿಟ್ಟು ಹೊಸ ದೇಹಗಳನ್ನು ಸೇರುತ್ತದೆ.
  student: >-
    ಅಜ್ಜ-ಅಜ್ಜಿಯರನ್ನು ಕಳೆದುಕೊಳ್ಳುವುದು ಅನೇಕ ಯುವಜನರಿಗೆ ಸಾವಿನೊಂದಿಗೆ ಮೊದಲ ಭೇಟಿ.
    ಈ ಶ್ಲೋಕ ಅದನ್ನು ಮೃದುವಾಗಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ನೆರವಾಗುತ್ತದೆ: ನೀವು ಪ್ರೀತಿಸಿದವರು ನೀವು
    ಕಂಡ ದೇಹಕ್ಕಿಂತ ಹೆಚ್ಚು. ಅವರ ಮೌಲ್ಯಗಳು ನಿಮ್ಮಲ್ಲಿ ಬದುಕುತ್ತವೆ.
  home: >-
    ಕುಟುಂಬ ಶೋಕಿಸುವಾಗ ಈ ಶ್ಲೋಕ ಕಣ್ಣೀರನ್ನು ನಿಷೇಧಿಸುವುದಿಲ್ಲ — ಅರ್ಜುನನ ದುಃಖ ನಿಜವಾಗಿತ್ತು.
    ಅದು ದೃಷ್ಟಿಕೋನ ನೀಡುತ್ತದೆ: ನಾವು ಕಳೆದುಕೊಂಡವರಲ್ಲಿದ್ದ ಸಾರ ನಾಶವಾಗುವುದಿಲ್ಲ. ಇದನ್ನು
    ಒಟ್ಟಿಗೆ ಪಠಿಸುವುದರಲ್ಲಿ ಕುಟುಂಬಗಳು ಸಾಂತ್ವನ ಕಾಣುತ್ತವೆ.
  work: >-
    ಕೆಲಸದಲ್ಲೂ ಬದಲಾವಣೆ "ಸತ್ತು ಮರುಹುಟ್ಟು" ಪಡೆಯುತ್ತದೆ: ಒಂದು ಹುದ್ದೆ ಮುಗಿಯುತ್ತದೆ,
    ತಂಡ ವಿಸರ್ಜನೆಯಾಗುತ್ತದೆ, ಕಂಪನಿ ಮುಚ್ಚುತ್ತದೆ. ನಿಮ್ಮ ಕೌಶಲ, ಸ್ವಭಾವ, ಸಂಬಂಧಗಳು —
    ನಿಜವಾದ ನೀವು — ಮುಂದಿನ "ಬಟ್ಟೆ"ಗೆ ಸಾಗುತ್ತವೆ.
  story:
    title: "ಯಕ್ಷಪ್ರಶ್ನೆ"
    source: "ಮಹಾಭಾರತ, ವನಪರ್ವ"
    text: >-
      ಸರೋವರವನ್ನು ಕಾಯುತ್ತಿದ್ದ ಯಕ್ಷನು ನೀರು ಕುಡಿಯುವ ಮೊದಲು ಯುಧಿಷ್ಠಿರನಿಗೆ ಅನೇಕ
      ಪ್ರಶ್ನೆಗಳನ್ನು ಕೇಳಿದನು. ಅವುಗಳಲ್ಲಿ ಒಂದು: "ಅತ್ಯಂತ ಆಶ್ಚರ್ಯ ಯಾವುದು?" ಯುಧಿಷ್ಠಿರ
      ಉತ್ತರಿಸಿದ: "ಪ್ರತಿದಿನ ಅಸಂಖ್ಯ ಜೀವಿಗಳು ಯಮನ ಮನೆಗೆ ಹೋಗುತ್ತವೆ; ಆದರೂ ಉಳಿದವರು
      ತಾವು ಶಾಶ್ವತವಾಗಿ ಬದುಕುತ್ತೇವೆ ಎಂಬಂತೆ ವರ್ತಿಸುತ್ತಾರೆ. ಇದಕ್ಕಿಂತ ಆಶ್ಚರ್ಯ ಇನ್ನೇನು?"
    connection: >-
      ದೇಹಗಳು ಬದಲಾಗುತ್ತವೆ ಎಂದು ನೆನಪಿಡುವುದು ಈಗ ಚೆನ್ನಾಗಿ ಬದುಕಲು ನೆರವಾಗುತ್ತದೆ: ಬೇಗ
      ಕ್ಷಮಿಸಲು, ಮುಕ್ತವಾಗಿ ಪ್ರೀತಿಸಲು, ವಿಷಯಗಳನ್ನು ಹಗುರವಾಗಿ ಹಿಡಿಯಲು.
  misreading: >-
    "ಸಾವು ಮುಖ್ಯವಲ್ಲ, ಆದ್ದರಿಂದ ಶೋಕಿಸಬೇಡ" ಎಂದಲ್ಲ. ಗೀತೆ ದುಃಖವನ್ನು ಒಪ್ಪುತ್ತದೆ;
    ಅದನ್ನು ತಿಳಿವಳಿಕೆಯಿಂದ ಸಹಿಸಿ ಕರ್ತವ್ಯಗಳನ್ನು ಮುಂದುವರಿಸಲು ನೆರವಾಗುತ್ತದೆ.
  practice: >-
    ನೀವು ಕಳೆದುಕೊಂಡ ಯಾರನ್ನಾದರೂ ನೆನಪಿಸಿಕೊಳ್ಳಿ. ಅವರ ಒಂದು ಗುಣವನ್ನು ಬರೆಯಿರಿ,
    ಅದನ್ನು ಮುಂದುವರಿಸಲು ಇಂದು ಒಮ್ಮೆ ಆಚರಿಸಿ.
