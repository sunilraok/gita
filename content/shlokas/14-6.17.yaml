ref: "6.17"
day: 14
theme: learning
illustration: balance-wheel
related: ["6.35", "2.48", "2.50"]
en:
  title: "Balance in food, rest, work and play"
  essence: "Not too much, not too little. Balanced living removes sorrow."
  meaning: >-
    For one who is moderate in eating and recreation, balanced in effort at
    work, and regulated in sleep and waking, yoga becomes the destroyer of
    sorrow.
  student: >-
    All-night study before exams, skipped meals, no play — and then burnout.
    A steady routine of sleep, food, study and exercise beats heroic cramming
    every single time.
  home: >-
    Regular family mealtimes, a bedtime routine, time for play and rest —
    these simple rhythms keep a household healthy and calm, especially for
    children and elders.
  work: >-
    Overwork is not dedication; it borrows from your future health. Protect
    your sleep, take breaks, and keep a life outside work. Sustainable pace
    produces better results over years.
  story:
    title: "The strings of the veena"
    source: "Buddhist tradition (a teaching shared across Indian traditions)"
    text: >-
      A monk named Sona strained so hard in his practice that he was ready to
      give up. The Buddha, knowing he had once played the veena, asked: "When
      the strings were too tight, did it make music?" "No." "When too loose?"
      "No." "When tuned just right?" "Yes." "So it is with effort," said the
      Buddha. Sona balanced his practice — and succeeded.
    connection: >-
      The Gita's "yukta" — balanced, well-tuned — is the same wisdom: a life
      tuned neither too tight nor too loose makes music.
  misreading: >-
    "Yoga means extreme fasting or sleepless discipline." The Gita (6.16)
    explicitly says yoga is not for one who eats too much or too little,
    sleeps too much or too little.
  practice: >-
    Draw your day as a pie chart: sleep, food, work/study, movement, family,
    screens. Adjust one slice by 30 minutes tomorrow.
kn:
  title: "ಆಹಾರ, ವಿಹಾರ, ಕೆಲಸ, ನಿದ್ರೆಯಲ್ಲಿ ಸಮತೋಲನ"
  essence: "ಅತಿಯೂ ಬೇಡ, ಕಡಿಮೆಯೂ ಬೇಡ. ಸಮತೋಲನದ ಬದುಕು ದುಃಖವನ್ನು ದೂರ ಮಾಡುತ್ತದೆ."
  meaning: >-
    ಹಿತಮಿತವಾದ ಆಹಾರ-ವಿಹಾರ, ಕೆಲಸಗಳಲ್ಲಿ ಹಿತಮಿತವಾದ ಪ್ರಯತ್ನ, ನಿಯಮಿತವಾದ ನಿದ್ರೆ-ಜಾಗರಣೆ
    ಇರುವವನಿಗೆ ಯೋಗವು ದುಃಖನಾಶಕವಾಗುತ್ತದೆ.
  student: >-
    ಪರೀಕ್ಷೆಯ ಮುನ್ನ ರಾತ್ರಿಯಿಡೀ ಓದು, ಊಟ ಬಿಡುವುದು, ಆಟವಿಲ್ಲ — ನಂತರ ಬಳಲಿಕೆ. ನಿದ್ರೆ,
    ಊಟ, ಓದು, ವ್ಯಾಯಾಮದ ಸ್ಥಿರ ದಿನಚರಿ ಪ್ರತಿ ಬಾರಿಯೂ ಕೊನೆಯ ಕ್ಷಣದ ಓದನ್ನು ಮೀರಿಸುತ್ತದೆ.
  home: >-
    ನಿಯಮಿತ ಕುಟುಂಬದ ಊಟದ ಸಮಯ, ಮಲಗುವ ದಿನಚರಿ, ಆಟ ಮತ್ತು ವಿಶ್ರಾಂತಿಗೆ ಸಮಯ — ಈ ಸರಳ
    ಲಯಗಳು ಮನೆಯನ್ನು, ವಿಶೇಷವಾಗಿ ಮಕ್ಕಳು ಮತ್ತು ಹಿರಿಯರನ್ನು, ಆರೋಗ್ಯವಾಗಿ ಶಾಂತವಾಗಿಡುತ್ತವೆ.
  work: >-
    ಅತಿಯಾದ ಕೆಲಸ ಸಮರ್ಪಣೆಯಲ್ಲ; ಅದು ನಿಮ್ಮ ಭವಿಷ್ಯದ ಆರೋಗ್ಯದಿಂದ ಸಾಲ ಪಡೆಯುತ್ತದೆ.
    ನಿದ್ರೆಯನ್ನು ಕಾಪಾಡಿ, ವಿರಾಮ ತೆಗೆದುಕೊಳ್ಳಿ, ಕೆಲಸದ ಹೊರಗೂ ಬದುಕಿರಲಿ. ಸುಸ್ಥಿರ ವೇಗ
    ವರ್ಷಗಳಲ್ಲಿ ಉತ್ತಮ ಫಲ ನೀಡುತ್ತದೆ.
  story:
    title: "ವೀಣೆಯ ತಂತಿಗಳು"
    source: "ಬೌದ್ಧ ಪರಂಪರೆ (ಭಾರತೀಯ ಪರಂಪರೆಗಳಲ್ಲಿ ಹಂಚಿಕೊಂಡ ಬೋಧನೆ)"
    text: >-
      ಸೋಣ ಎಂಬ ಭಿಕ್ಷು ಸಾಧನೆಯಲ್ಲಿ ಅತಿಯಾಗಿ ಶ್ರಮಿಸಿ ಕೈಬಿಡುವ ಹಂತಕ್ಕೆ ಬಂದನು. ಅವನು
      ಹಿಂದೆ ವೀಣೆ ನುಡಿಸುತ್ತಿದ್ದನೆಂದು ತಿಳಿದಿದ್ದ ಬುದ್ಧ ಕೇಳಿದರು: "ತಂತಿ ತುಂಬಾ ಬಿಗಿಯಾಗಿದ್ದಾಗ
      ಸಂಗೀತ ಬರುತ್ತಿತ್ತೇ?" "ಇಲ್ಲ." "ತುಂಬಾ ಸಡಿಲವಾಗಿದ್ದಾಗ?" "ಇಲ್ಲ." "ಸರಿಯಾಗಿ ಶ್ರುತಿ
      ಮಾಡಿದಾಗ?" "ಹೌದು." "ಪ್ರಯತ್ನವೂ ಹಾಗೆಯೇ" ಎಂದರು ಬುದ್ಧ. ಸೋಣ ತನ್ನ ಸಾಧನೆಯನ್ನು
      ಸಮತೋಲನಗೊಳಿಸಿ ಯಶಸ್ವಿಯಾದನು.
    connection: >-
      ಗೀತೆಯ "ಯುಕ್ತ" — ಸಮತೋಲಿತ, ಶ್ರುತಿಗೊಂಡ — ಅದೇ ಜ್ಞಾನ: ತುಂಬಾ ಬಿಗಿಯೂ ಅಲ್ಲದ, ಸಡಿಲವೂ
      ಅಲ್ಲದ ಬದುಕು ಸಂಗೀತವಾಗುತ್ತದೆ.
  misreading: >-
    "ಯೋಗ ಎಂದರೆ ತೀವ್ರ ಉಪವಾಸ ಅಥವಾ ನಿದ್ರೆಯಿಲ್ಲದ ಶಿಸ್ತು" ಎಂದಲ್ಲ. ಅತಿಯಾಗಿ ತಿನ್ನುವವನಿಗೂ
    ತಿನ್ನದವನಿಗೂ, ಅತಿಯಾಗಿ ನಿದ್ರಿಸುವವನಿಗೂ ನಿದ್ರಿಸದವನಿಗೂ ಯೋಗವಿಲ್ಲ ಎಂದು ಗೀತೆಯೇ (6.16) ಹೇಳುತ್ತದೆ.
  practice: >-
    ನಿಮ್ಮ ದಿನವನ್ನು ವೃತ್ತಚಿತ್ರವಾಗಿ ಬರೆಯಿರಿ: ನಿದ್ರೆ, ಊಟ, ಕೆಲಸ/ಓದು, ವ್ಯಾಯಾಮ, ಕುಟುಂಬ,
    ಪರದೆ. ನಾಳೆ ಒಂದು ಭಾಗವನ್ನು 30 ನಿಮಿಷ ಸರಿಹೊಂದಿಸಿ.
