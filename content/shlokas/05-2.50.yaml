en:
  title: "Yoga is skill in action"
  essence: "Bring full attention, care and a calm mind to whatever you do."
  meaning: >-
    One whose understanding is steady lets go, even here, of both good and bad
    results. So devote yourself to yoga — yoga is skill in action.
  student: >-
    Skill is not only talent; it is attention plus care. Neat handwriting,
    labelled diagrams, checking your answers, reading the question twice —
    small acts of care add up to excellence.
  home: >-
    Cooking a meal, tending a plant, helping with homework, looking after an
    elder — done with attention, ordinary household work becomes a practice
    of yoga, not a chore to be rushed.
  work: >-
    The best professionals are calm under pressure because their mind is on
    the work, not on fear of blame. Do each task — even an email — as if your
    name is signed on it. It is.
  story:
    title: "The craftsman of the temple lamp"
    source: "Illustrative story"
    text: >-
      A lamp-maker near a temple town made small brass lamps all day. A
      visitor asked him why he polished the underside of each lamp, where no
      one would ever look. He smiled: "The lamp knows. And my hands know. If I
      am careless where no one sees, I will soon be careless where everyone
      sees." His lamps were famous for a hundred kilometres around.
    connection: >-
      Skill in action is a habit of the mind, not a performance for others.
  misreading: >-
    "Yoga means only postures or meditation." In the Gita, yoga also means
    the way you do your everyday work — with steadiness and excellence.
  practice: >-
    Choose one routine task today and do it with complete attention, as if it
    were the most important thing you will do.
kn:
  title: "ಯೋಗಃ ಕರ್ಮಸು ಕೌಶಲಮ್ — ಕೆಲಸದಲ್ಲಿ ಕೌಶಲವೇ ಯೋಗ"
  essence: "ಯಾವ ಕೆಲಸವನ್ನೇ ಮಾಡಲಿ, ಪೂರ್ಣ ಗಮನ, ಕಾಳಜಿ ಮತ್ತು ಶಾಂತ ಮನಸ್ಸಿನಿಂದ ಮಾಡು."
  meaning: >-
    ಸ್ಥಿರ ಬುದ್ಧಿಯುಳ್ಳವನು ಇಲ್ಲಿಯೇ ಒಳ್ಳೆಯ-ಕೆಟ್ಟ ಎರಡೂ ಫಲಗಳನ್ನು ತೊರೆಯುತ್ತಾನೆ.
    ಆದ್ದರಿಂದ ಯೋಗದಲ್ಲಿ ತೊಡಗು — ಕರ್ಮಗಳಲ್ಲಿನ ಕೌಶಲವೇ ಯೋಗ.
  student: >-
    ಕೌಶಲ ಎಂದರೆ ಕೇವಲ ಪ್ರತಿಭೆಯಲ್ಲ; ಗಮನ ಮತ್ತು ಕಾಳಜಿ. ಅಚ್ಚುಕಟ್ಟಾದ ಬರವಣಿಗೆ,
    ಹೆಸರಿಸಿದ ಚಿತ್ರಗಳು, ಉತ್ತರಗಳನ್ನು ಮತ್ತೊಮ್ಮೆ ಪರಿಶೀಲಿಸುವುದು, ಪ್ರಶ್ನೆಯನ್ನು
    ಎರಡು ಬಾರಿ ಓದುವುದು — ಈ ಸಣ್ಣ ಕಾಳಜಿಗಳೇ ಶ್ರೇಷ್ಠತೆಯಾಗುತ್ತವೆ.
  home: >-
    ಅಡುಗೆ ಮಾಡುವುದು, ಗಿಡಕ್ಕೆ ನೀರೆರೆಯುವುದು, ಮನೆಗೆಲಸದಲ್ಲಿ ಮಕ್ಕಳಿಗೆ ನೆರವಾಗುವುದು,
    ಹಿರಿಯರ ಆರೈಕೆ — ಗಮನದಿಂದ ಮಾಡಿದರೆ ಸಾಮಾನ್ಯ ಮನೆಗೆಲಸವೂ ಯೋಗಾಭ್ಯಾಸವಾಗುತ್ತದೆ,
    ಅವಸರದ ಹೊರೆಯಲ್ಲ.
  work: >-
    ಅತ್ಯುತ್ತಮ ವೃತ್ತಿಪರರು ಒತ್ತಡದಲ್ಲೂ ಶಾಂತವಾಗಿರುತ್ತಾರೆ, ಏಕೆಂದರೆ ಅವರ ಮನಸ್ಸು
    ಕೆಲಸದ ಮೇಲಿರುತ್ತದೆ, ದೂಷಣೆಯ ಭಯದ ಮೇಲಲ್ಲ. ಪ್ರತಿಯೊಂದು ಕೆಲಸವನ್ನೂ — ಒಂದು
    ಇಮೇಲ್ ಆದರೂ — ಅದರ ಮೇಲೆ ನಿಮ್ಮ ಸಹಿ ಇದೆ ಎಂಬಂತೆ ಮಾಡಿ. ನಿಜಕ್ಕೂ ಇದೆ.
  story:
    title: "ದೇವಾಲಯದ ದೀಪ ಮಾಡುವವನು"
    source: "ದೃಷ್ಟಾಂತ ಕಥೆ"
    text: >-
      ದೇವಾಲಯದ ಊರಿನ ಬಳಿ ಒಬ್ಬ ಕುಶಲಕರ್ಮಿ ದಿನವಿಡೀ ಹಿತ್ತಾಳೆಯ ದೀಪಗಳನ್ನು ಮಾಡುತ್ತಿದ್ದ.
      ಯಾರೂ ನೋಡದ ದೀಪದ ಅಡಿಭಾಗವನ್ನೂ ಏಕೆ ಹೊಳಪು ಮಾಡುತ್ತೀಯ ಎಂದು ಒಬ್ಬ ಸಂದರ್ಶಕ
      ಕೇಳಿದ. ಅವನು ನಕ್ಕು ಹೇಳಿದ: "ದೀಪಕ್ಕೆ ಗೊತ್ತು. ನನ್ನ ಕೈಗಳಿಗೂ ಗೊತ್ತು. ಯಾರೂ
      ನೋಡದಲ್ಲಿ ಅಸಡ್ಡೆ ಮಾಡಿದರೆ, ಬೇಗನೆ ಎಲ್ಲರೂ ನೋಡುವಲ್ಲೂ ಅಸಡ್ಡೆ ಮಾಡುತ್ತೇನೆ."
      ಅವನ ದೀಪಗಳು ಸುತ್ತಮುತ್ತಲಿನ ನೂರು ಕಿಲೋಮೀಟರ್‌ಗಳಲ್ಲಿ ಪ್ರಸಿದ್ಧವಾಗಿದ್ದವು.
    connection: >-
      ಕರ್ಮಕೌಶಲ ಎಂಬುದು ಮನಸ್ಸಿನ ಅಭ್ಯಾಸ, ಇತರರಿಗಾಗಿ ಮಾಡುವ ಪ್ರದರ್ಶನವಲ್ಲ.
  misreading: >-
    "ಯೋಗ ಎಂದರೆ ಆಸನ ಅಥವಾ ಧ್ಯಾನ ಮಾತ್ರ" ಎಂದಲ್ಲ. ಗೀತೆಯಲ್ಲಿ ಯೋಗ ಎಂದರೆ ನಿತ್ಯದ
    ಕೆಲಸವನ್ನು ಸ್ಥಿರತೆ ಮತ್ತು ಶ್ರೇಷ್ಠತೆಯಿಂದ ಮಾಡುವ ರೀತಿಯೂ ಹೌದು.
  practice: >-
    ಇಂದು ಒಂದು ದಿನನಿತ್ಯದ ಕೆಲಸವನ್ನು ಆರಿಸಿ, ಅದೇ ಇಂದಿನ ಅತ್ಯಂತ ಮುಖ್ಯ ಕೆಲಸ ಎಂಬಂತೆ
    ಸಂಪೂರ್ಣ ಗಮನದಿಂದ ಮಾಡಿ.
