ref: "3.35"
day: 2
theme: courage
illustration: own-path
related: ["18.48", "2.3", "6.5"]
en:
  title: "Walk your own path"
  essence: "Your own path, walked imperfectly, is better than someone else's copied perfectly."
  meaning: >-
    It is better to follow your own duty, even imperfectly, than to follow
    another's duty well. Even to fall while doing your own duty is better; the
    path of another is full of fear.
  student: >-
    Choosing a stream or a career only because a friend, cousin or neighbour
    chose it is "another's path". Discover what you are suited for and what
    you care about — then give it your best, even if you are not the topper.
  home: >-
    Every family member has a different role and nature. Comparing a child
    with a sibling, or a home with the neighbour's, creates quiet pressure.
    Let each person grow along their own line.
  work: >-
    Copying a colleague's style, chasing a role that looks glamorous, or
    measuring yourself by someone else's promotion leads to anxiety. Build on
    your strengths and responsibilities; that is where you do your best work.
  story:
    title: "Arjuna wants to become a monk"
    source: "Bhagavad Gita 2.5 and 3.35"
    text: >-
      Overwhelmed, Arjuna said it would be better to live on alms like a
      renunciant than to fight. It sounded noble. But Arjuna was a protector by
      nature and by role; thousands depended on him. Krishna gently showed him
      that running to someone else's path out of fear is not spirituality — it
      is escape. Arjuna's growth lay in doing his own duty with a clean heart.
    connection: >-
      Sometimes the "other path" looks peaceful only because we are afraid of
      our own. The Gita asks us to be honest about which is which.
  misreading: >-
    "Stay in the role you were born into." No — "sva-dharma" is about your own
    nature, abilities and responsibilities, not about caste or never changing.
  practice: >-
    Write down three things you are naturally good at and one responsibility
    only you can fulfil. Spend 30 minutes today on one of them.
kn:
  title: "ನಿನ್ನ ದಾರಿಯಲ್ಲೇ ನಡೆ"
  essence: "ಬೇರೆಯವರ ದಾರಿಯನ್ನು ಚೆನ್ನಾಗಿ ಅನುಕರಿಸುವುದಕ್ಕಿಂತ ನಿನ್ನ ದಾರಿಯಲ್ಲಿ ಅಪೂರ್ಣವಾಗಿ ನಡೆಯುವುದೇ ಶ್ರೇಷ್ಠ."
  meaning: >-
    ಇನ್ನೊಬ್ಬರ ಧರ್ಮವನ್ನು ಚೆನ್ನಾಗಿ ಆಚರಿಸುವುದಕ್ಕಿಂತ, ಗುಣರಹಿತವಾದರೂ ತನ್ನ ಧರ್ಮವೇ
    ಶ್ರೇಯಸ್ಕರ. ತನ್ನ ಧರ್ಮದಲ್ಲಿ ಮರಣವೂ ಶ್ರೇಯಸ್ಸು; ಪರಧರ್ಮ ಭಯವನ್ನು ತರುತ್ತದೆ.
  student: >-
    ಸ್ನೇಹಿತ, ಸಂಬಂಧಿ ಅಥವಾ ನೆರೆಹೊರೆಯವರು ಆರಿಸಿದರು ಎಂಬ ಕಾರಣಕ್ಕೆ ಮಾತ್ರ ವಿಷಯ ಅಥವಾ
    ವೃತ್ತಿಯನ್ನು ಆರಿಸುವುದು "ಪರಧರ್ಮ". ನಿಮಗೆ ಯಾವುದು ಹೊಂದುತ್ತದೆ, ನಿಮಗೆ ಯಾವುದರಲ್ಲಿ
    ಆಸಕ್ತಿ ಇದೆ ಎಂದು ಕಂಡುಕೊಳ್ಳಿ — ಟಾಪರ್ ಆಗದಿದ್ದರೂ ಅದರಲ್ಲಿ ನಿಮ್ಮ ಅತ್ಯುತ್ತಮವನ್ನು ನೀಡಿ.
  home: >-
    ಮನೆಯ ಪ್ರತಿಯೊಬ್ಬರ ಪಾತ್ರ ಮತ್ತು ಸ್ವಭಾವ ಬೇರೆ ಬೇರೆ. ಒಬ್ಬ ಮಗುವನ್ನು ಅಣ್ಣ-ತಂಗಿಯೊಂದಿಗೆ,
    ನಮ್ಮ ಮನೆಯನ್ನು ಪಕ್ಕದ ಮನೆಯೊಂದಿಗೆ ಹೋಲಿಸುವುದು ಮೌನ ಒತ್ತಡವನ್ನು ಉಂಟುಮಾಡುತ್ತದೆ.
    ಪ್ರತಿಯೊಬ್ಬರೂ ತಮ್ಮದೇ ರೀತಿಯಲ್ಲಿ ಬೆಳೆಯಲಿ.
  work: >-
    ಸಹೋದ್ಯೋಗಿಯ ಶೈಲಿಯನ್ನು ನಕಲು ಮಾಡುವುದು, ಆಕರ್ಷಕವಾಗಿ ಕಾಣುವ ಹುದ್ದೆಯ ಹಿಂದೆ ಓಡುವುದು,
    ಇನ್ನೊಬ್ಬರ ಬಡ್ತಿಯಿಂದ ನಮ್ಮನ್ನು ಅಳೆಯುವುದು ಆತಂಕಕ್ಕೆ ಕಾರಣ. ನಿಮ್ಮ ಸಾಮರ್ಥ್ಯ ಮತ್ತು
    ಜವಾಬ್ದಾರಿಗಳ ಮೇಲೆ ಕಟ್ಟಿ; ಅಲ್ಲೇ ನಿಮ್ಮ ಅತ್ಯುತ್ತಮ ಕೆಲಸ ಹೊರಬರುತ್ತದೆ.
  story:
    title: "ಸನ್ಯಾಸಿಯಾಗಲು ಬಯಸಿದ ಅರ್ಜುನ"
    source: "ಭಗವದ್ಗೀತೆ 2.5 ಮತ್ತು 3.35"
    text: >-
      ಕಂಗಾಲಾದ ಅರ್ಜುನ, ಯುದ್ಧ ಮಾಡುವುದಕ್ಕಿಂತ ಭಿಕ್ಷೆ ಬೇಡಿ ಬದುಕುವುದೇ ಲೇಸು ಎಂದನು.
      ಕೇಳಲು ಅದು ಉದಾತ್ತವಾಗಿತ್ತು. ಆದರೆ ಅರ್ಜುನ ಸ್ವಭಾವದಿಂದಲೂ ಪಾತ್ರದಿಂದಲೂ ರಕ್ಷಕ;
      ಸಾವಿರಾರು ಜನ ಅವನನ್ನು ನಂಬಿದ್ದರು. ಭಯದಿಂದ ಇನ್ನೊಬ್ಬರ ದಾರಿಗೆ ಓಡುವುದು
      ಆಧ್ಯಾತ್ಮವಲ್ಲ, ಪಲಾಯನ ಎಂದು ಕೃಷ್ಣ ಮೃದುವಾಗಿ ತೋರಿಸಿದನು. ಶುದ್ಧ ಮನಸ್ಸಿನಿಂದ ತನ್ನ
      ಕರ್ತವ್ಯವನ್ನು ಮಾಡುವುದರಲ್ಲೇ ಅರ್ಜುನನ ಬೆಳವಣಿಗೆ ಇತ್ತು.
    connection: >-
      ಕೆಲವೊಮ್ಮೆ "ಇನ್ನೊಂದು ದಾರಿ" ಶಾಂತವಾಗಿ ಕಾಣುವುದು ನಮ್ಮ ದಾರಿಯ ಬಗ್ಗೆ ಭಯವಿರುವುದರಿಂದ
      ಮಾತ್ರ. ಯಾವುದು ಯಾವುದು ಎಂದು ಪ್ರಾಮಾಣಿಕವಾಗಿ ನೋಡಲು ಗೀತೆ ಹೇಳುತ್ತದೆ.
  misreading: >-
    "ಹುಟ್ಟಿದ ಪಾತ್ರದಲ್ಲೇ ಇರು" ಎಂದಲ್ಲ. "ಸ್ವಧರ್ಮ" ಎಂದರೆ ನಿಮ್ಮ ಸ್ವಭಾವ, ಸಾಮರ್ಥ್ಯ ಮತ್ತು
    ಜವಾಬ್ದಾರಿ — ಜಾತಿಯಲ್ಲ, ಎಂದಿಗೂ ಬದಲಾಗಬಾರದು ಎಂಬುದೂ ಅಲ್ಲ.
  practice: >-
    ನಿಮಗೆ ಸಹಜವಾಗಿ ಚೆನ್ನಾಗಿ ಬರುವ ಮೂರು ವಿಷಯಗಳನ್ನು ಮತ್ತು ನೀವು ಮಾತ್ರ ನಿಭಾಯಿಸಬಲ್ಲ
    ಒಂದು ಜವಾಬ್ದಾರಿಯನ್ನು ಬರೆಯಿರಿ. ಇಂದು ಅವುಗಳಲ್ಲಿ ಒಂದಕ್ಕೆ 30 ನಿಮಿಷ ಕೊಡಿ.
