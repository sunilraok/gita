ref: "16.21"
day: 11
theme: mind
illustration: three-gates
related: ["2.62-63", "6.5", "17.15"]
en:
  title: "Three gates to self-destruction"
  essence: "Lust, anger and greed destroy us from within. Close these three gates."
  meaning: >-
    There are three gates to this hell that destroys the self: lust, anger and
    greed. Therefore one should give up these three.
  student: >-
    Cheating in an exam (greed for marks), losing your temper at a friend
    (anger), obsessing over someone or something (lust) — each seems small
    in the moment, but each quietly damages who you are becoming.
  home: >-
    Most family breakups trace back to one of these three: a fight over
    property (greed), words said in rage (anger), or betrayal (lust). Guard
    these gates at home.
  work: >-
    Fraud and scandals in companies almost always begin with greed; toxic
    teams with unchecked anger. Integrity is simply keeping these three gates
    shut when nobody is watching.
  story:
    title: "Ravana's fall"
    source: "Valmiki Ramayana"
    text: >-
      Ravana was learned, powerful, a great devotee of Shiva and a king of a
      golden city. Yet his desire for Sita (lust), his fury at every warning
      (anger), and his refusal to give back what was not his (greed) led him
      to ignore the counsel of his own brother Vibhishana. His kingdom, sons
      and life were lost.
    connection: >-
      Talent and power do not protect us. Even the mightiest fall through
      these three gates.
  misreading: >-
    "Having any desire, frustration or ambition is sinful." No — the verse
    warns against these three when they rule us and harm ourselves or others.
  practice: >-
    Tonight, reflect: did lust, anger or greed make any decision for me today?
    What would I do differently?
kn:
  title: "ನಾಶದ ಮೂರು ಬಾಗಿಲುಗಳು"
  essence: "ಕಾಮ, ಕ್ರೋಧ, ಲೋಭ ನಮ್ಮನ್ನು ಒಳಗಿನಿಂದಲೇ ನಾಶಮಾಡುತ್ತವೆ. ಈ ಮೂರು ಬಾಗಿಲುಗಳನ್ನು ಮುಚ್ಚು."
  meaning: >-
    ಆತ್ಮನಾಶಕವಾದ ನರಕಕ್ಕೆ ಮೂರು ಬಾಗಿಲುಗಳಿವೆ: ಕಾಮ, ಕ್ರೋಧ ಮತ್ತು ಲೋಭ. ಆದ್ದರಿಂದ
    ಈ ಮೂರನ್ನೂ ತ್ಯಜಿಸಬೇಕು.
  student: >-
    ಪರೀಕ್ಷೆಯಲ್ಲಿ ನಕಲು (ಅಂಕದ ಲೋಭ), ಸ್ನೇಹಿತನ ಮೇಲೆ ಸಿಟ್ಟು (ಕ್ರೋಧ), ಯಾರನ್ನಾದರೂ
    ಅಥವಾ ಯಾವುದನ್ನಾದರೂ ಕುರಿತು ಗೀಳು (ಕಾಮ) — ಆ ಕ್ಷಣದಲ್ಲಿ ಚಿಕ್ಕದಾಗಿ ಕಂಡರೂ,
    ಪ್ರತಿಯೊಂದೂ ನೀವು ಯಾರಾಗುತ್ತಿದ್ದೀರಿ ಎಂಬುದನ್ನು ಮೌನವಾಗಿ ಹಾಳುಮಾಡುತ್ತದೆ.
  home: >-
    ಹೆಚ್ಚಿನ ಕುಟುಂಬ ಕಲಹಗಳ ಮೂಲ ಈ ಮೂರರಲ್ಲಿ ಒಂದು: ಆಸ್ತಿಗಾಗಿ ಜಗಳ (ಲೋಭ), ಕೋಪದಲ್ಲಿ
    ಆಡಿದ ಮಾತು (ಕ್ರೋಧ), ಅಥವಾ ದ್ರೋಹ (ಕಾಮ). ಮನೆಯಲ್ಲಿ ಈ ಬಾಗಿಲುಗಳನ್ನು ಕಾಯಿರಿ.
  work: >-
    ಕಂಪನಿಗಳಲ್ಲಿನ ವಂಚನೆ, ಹಗರಣಗಳು ಬಹುತೇಕ ಲೋಭದಿಂದ ಆರಂಭವಾಗುತ್ತವೆ; ವಿಷಮಯ ತಂಡಗಳು
    ನಿಯಂತ್ರಣವಿಲ್ಲದ ಕೋಪದಿಂದ. ಯಾರೂ ನೋಡದಿದ್ದಾಗಲೂ ಈ ಮೂರು ಬಾಗಿಲುಗಳನ್ನು ಮುಚ್ಚಿಡುವುದೇ
    ಪ್ರಾಮಾಣಿಕತೆ.
  story:
    title: "ರಾವಣನ ಪತನ"
    source: "ವಾಲ್ಮೀಕಿ ರಾಮಾಯಣ"
    text: >-
      ರಾವಣ ವಿದ್ವಾಂಸ, ಬಲಶಾಲಿ, ಮಹಾ ಶಿವಭಕ್ತ, ಸ್ವರ್ಣನಗರಿಯ ರಾಜ. ಆದರೂ ಸೀತೆಯ ಮೇಲಿನ
      ಬಯಕೆ (ಕಾಮ), ಪ್ರತಿ ಎಚ್ಚರಿಕೆಗೂ ಉಕ್ಕುವ ಕೋಪ (ಕ್ರೋಧ), ತನ್ನದಲ್ಲದ್ದನ್ನು ಮರಳಿಸಲು
      ನಿರಾಕರಣೆ (ಲೋಭ) — ಇವು ತನ್ನ ಸ್ವಂತ ತಮ್ಮ ವಿಭೀಷಣನ ಸಲಹೆಯನ್ನೂ ಕಡೆಗಣಿಸುವಂತೆ
      ಮಾಡಿದವು. ರಾಜ್ಯ, ಮಕ್ಕಳು, ಪ್ರಾಣ ಎಲ್ಲವೂ ಹೋಯಿತು.
    connection: >-
      ಪ್ರತಿಭೆ ಮತ್ತು ಅಧಿಕಾರ ನಮ್ಮನ್ನು ರಕ್ಷಿಸುವುದಿಲ್ಲ. ಮಹಾಬಲಿಗಳೂ ಈ ಮೂರು ಬಾಗಿಲುಗಳಿಂದ
      ಬೀಳುತ್ತಾರೆ.
  misreading: >-
    "ಯಾವುದೇ ಬಯಕೆ, ಅಸಮಾಧಾನ ಅಥವಾ ಮಹತ್ವಾಕಾಂಕ್ಷೆ ಪಾಪ" ಎಂದಲ್ಲ. ಇವು ನಮ್ಮನ್ನು ಆಳಿ,
    ನಮಗೆ ಅಥವಾ ಇತರರಿಗೆ ಹಾನಿ ಮಾಡಿದಾಗ ಎಚ್ಚರ ಎಂಬುದೇ ಸಂದೇಶ.
  practice: >-
    ಇಂದು ರಾತ್ರಿ ಯೋಚಿಸಿ: ಇಂದು ಕಾಮ, ಕ್ರೋಧ ಅಥವಾ ಲೋಭ ನನ್ನ ಪರವಾಗಿ ಯಾವುದಾದರೂ ನಿರ್ಧಾರ
    ಮಾಡಿದವೇ? ನಾನು ಬೇರೆ ಏನು ಮಾಡಬಹುದಿತ್ತು?
