ref: "2.47"
day: 3
theme: work
illustration: control-circle
related: ["2.48", "2.50", "18.48"]
en:
  title: "Your right is to the effort, not the fruit"
  essence: "Give your full effort; let go of anxiety about the result."
  meaning: >-
    You have a right to your actions, but never to their results. Do not let
    the reward be your only motive — and do not let that become an excuse for
    doing nothing either.
  student: >-
    Your part is the hours of honest study, the practice papers, the doubts you
    clear with your teacher. The question paper, the evaluator and the cut-off
    are not fully in your hands. Students who study this way sleep better
    before exams — and usually do better, because fear no longer eats their focus.
  home: >-
    A parent helps a child prepare, cooks the meals, keeps the home calm — and
    then lets go of the rank. Praise effort ("you worked so steadily") and not
    only marks, and children learn to keep trying after a setback.
  work: >-
    You own the quality of the proposal, the code, the pitch. The client's
    decision, the market and the appraisal committee are outside you. When a
    deal is lost, review the process — not your self-worth — and move to the
    next task.
  story:
    title: "The bird's eye"
    source: "Mahabharata, Adi Parva"
    text: >-
      Guru Drona placed a wooden bird on a tree and asked his students to aim
      at its eye. Before each shot he asked, "What do you see?" One saw the
      tree, the branches and the bird; another saw the sky and the leaves.
      Drona told each of them to lower the bow. Arjuna said, "I see only the
      bird's eye." "Shoot," said Drona — and Arjuna struck the mark.
    connection: >-
      Arjuna's attention was entirely on the act in front of him — not on the
      applause, the rivals or the prize. Full presence in the action is exactly
      what this verse asks for.
  misreading: >-
    "Don't care about results." No — plan for results and aim high. The verse
    asks you not to be attached to results or paralysed by them.
  practice: >-
    Before one important task, make two lists: "In my hands" and "Not in my
    hands". Put your full energy into the first list only.
kn:
  title: "ಕರ್ಮದಲ್ಲಿ ಮಾತ್ರ ನಿನ್ನ ಅಧಿಕಾರ, ಫಲದಲ್ಲಲ್ಲ"
  essence: "ಪೂರ್ಣ ಪ್ರಯತ್ನ ನೀಡು; ಫಲದ ಬಗ್ಗೆ ಆತಂಕವನ್ನು ಬಿಡು."
  meaning: >-
    ಕರ್ಮ ಮಾಡುವುದರಲ್ಲಿ ಮಾತ್ರ ನಿನಗೆ ಅಧಿಕಾರ, ಅದರ ಫಲದಲ್ಲಿ ಎಂದಿಗೂ ಇಲ್ಲ. ಫಲವೇ ನಿನ್ನ
    ಕೆಲಸದ ಕಾರಣವಾಗದಿರಲಿ — ಹಾಗೆಂದು ಕೆಲಸವನ್ನೇ ಬಿಡುವುದರಲ್ಲೂ ನಿನಗೆ ಆಸಕ್ತಿ ಬೇಡ.
  student: >-
    ಪ್ರಾಮಾಣಿಕವಾಗಿ ಓದುವ ಗಂಟೆಗಳು, ಅಭ್ಯಾಸ ಪತ್ರಿಕೆಗಳು, ಶಿಕ್ಷಕರೊಂದಿಗೆ ಸಂಶಯ
    ಬಗೆಹರಿಸಿಕೊಳ್ಳುವುದು — ಇದು ನಿಮ್ಮ ಪಾಲು. ಪ್ರಶ್ನೆಪತ್ರಿಕೆ, ಮೌಲ್ಯಮಾಪಕರು, ಕಟ್-ಆಫ್
    ಸಂಪೂರ್ಣವಾಗಿ ನಿಮ್ಮ ಕೈಯಲ್ಲಿಲ್ಲ. ಹೀಗೆ ಓದುವ ವಿದ್ಯಾರ್ಥಿಗಳು ಪರೀಕ್ಷೆಯ ಹಿಂದಿನ ರಾತ್ರಿ
    ನೆಮ್ಮದಿಯಿಂದ ನಿದ್ರಿಸುತ್ತಾರೆ — ಭಯ ಏಕಾಗ್ರತೆಯನ್ನು ತಿನ್ನದ ಕಾರಣ ಹೆಚ್ಚಾಗಿ ಚೆನ್ನಾಗಿಯೂ ಬರೆಯುತ್ತಾರೆ.
  home: >-
    ತಂದೆ-ತಾಯಿ ಮಗುವಿನ ತಯಾರಿಗೆ ನೆರವಾಗುತ್ತಾರೆ, ಅಡುಗೆ ಮಾಡುತ್ತಾರೆ, ಮನೆಯನ್ನು ಶಾಂತವಾಗಿಡುತ್ತಾರೆ —
    ನಂತರ ರ್‍ಯಾಂಕ್ ಬಗ್ಗೆ ಹಿಡಿತ ಬಿಡುತ್ತಾರೆ. ಅಂಕಗಳನ್ನು ಮಾತ್ರವಲ್ಲ, ಪ್ರಯತ್ನವನ್ನು ಹೊಗಳಿ
    ("ನೀನು ಎಷ್ಟು ಶ್ರದ್ಧೆಯಿಂದ ಓದಿದೆ!"). ಆಗ ಮಕ್ಕಳು ಸೋಲಿನ ನಂತರವೂ ಪ್ರಯತ್ನ ಮುಂದುವರಿಸುತ್ತಾರೆ.
  work: >-
    ಪ್ರಸ್ತಾವನೆ, ಕೋಡ್, ಪ್ರಸ್ತುತಿಯ ಗುಣಮಟ್ಟ ನಿಮ್ಮದು. ಗ್ರಾಹಕರ ನಿರ್ಧಾರ, ಮಾರುಕಟ್ಟೆ,
    ಮೌಲ್ಯಮಾಪನ ಸಮಿತಿ ನಿಮ್ಮ ಹೊರಗಿನವು. ಒಪ್ಪಂದ ಕೈತಪ್ಪಿದಾಗ ಪ್ರಕ್ರಿಯೆಯನ್ನು
    ಪರಿಶೀಲಿಸಿ — ನಿಮ್ಮ ಆತ್ಮಗೌರವವನ್ನಲ್ಲ — ಮತ್ತು ಮುಂದಿನ ಕೆಲಸಕ್ಕೆ ಸಾಗಿ.
  story:
    title: "ಹಕ್ಕಿಯ ಕಣ್ಣು"
    source: "ಮಹಾಭಾರತ, ಆದಿಪರ್ವ"
    text: >-
      ಗುರು ದ್ರೋಣರು ಮರದ ಮೇಲೆ ಮರದ ಹಕ್ಕಿಯೊಂದನ್ನು ಇಟ್ಟು, ಅದರ ಕಣ್ಣಿಗೆ ಗುರಿ ಇಡಲು
      ಶಿಷ್ಯರಿಗೆ ಹೇಳಿದರು. ಬಾಣ ಬಿಡುವ ಮುನ್ನ ಪ್ರತಿಯೊಬ್ಬರನ್ನೂ "ನಿನಗೆ ಏನು ಕಾಣುತ್ತಿದೆ?"
      ಎಂದು ಕೇಳಿದರು. ಒಬ್ಬನಿಗೆ ಮರ, ಕೊಂಬೆ, ಹಕ್ಕಿ ಕಂಡವು; ಇನ್ನೊಬ್ಬನಿಗೆ ಆಕಾಶ, ಎಲೆಗಳು.
      ದ್ರೋಣರು ಎಲ್ಲರಿಗೂ ಬಿಲ್ಲು ಇಳಿಸಲು ಹೇಳಿದರು. ಅರ್ಜುನ "ನನಗೆ ಹಕ್ಕಿಯ ಕಣ್ಣು ಮಾತ್ರ
      ಕಾಣುತ್ತಿದೆ" ಎಂದನು. "ಬಿಡು" ಎಂದರು ದ್ರೋಣರು — ಅರ್ಜುನನ ಬಾಣ ಗುರಿ ಮುಟ್ಟಿತು.
    connection: >-
      ಅರ್ಜುನನ ಗಮನ ಸಂಪೂರ್ಣವಾಗಿ ಎದುರಿನ ಕೆಲಸದ ಮೇಲಿತ್ತು — ಚಪ್ಪಾಳೆ, ಪ್ರತಿಸ್ಪರ್ಧಿ
      ಅಥವಾ ಬಹುಮಾನದ ಮೇಲಲ್ಲ. ಕೆಲಸದಲ್ಲಿ ಪೂರ್ಣ ತನ್ಮಯತೆಯನ್ನೇ ಈ ಶ್ಲೋಕ ಕೇಳುತ್ತದೆ.
  misreading: >-
    "ಫಲದ ಬಗ್ಗೆ ಯೋಚಿಸಲೇಬೇಡ" ಎಂದಲ್ಲ. ಗುರಿ ಹಾಕಿಕೊಳ್ಳಿ, ಯೋಜನೆ ಮಾಡಿ. ಫಲಕ್ಕೆ
    ಅಂಟಿಕೊಳ್ಳಬೇಡಿ, ಅದರ ಭಯದಿಂದ ಸ್ತಬ್ಧರಾಗಬೇಡಿ ಎಂಬುದೇ ಸಂದೇಶ.
  practice: >-
    ಒಂದು ಮುಖ್ಯ ಕೆಲಸದ ಮೊದಲು ಎರಡು ಪಟ್ಟಿ ಮಾಡಿ: "ನನ್ನ ಕೈಯಲ್ಲಿರುವುದು" ಮತ್ತು
    "ನನ್ನ ಕೈಯಲ್ಲಿಲ್ಲದ್ದು". ನಿಮ್ಮ ಪೂರ್ಣ ಶಕ್ತಿಯನ್ನು ಮೊದಲ ಪಟ್ಟಿಗೆ ಮಾತ್ರ ನೀಡಿ.
