ref: "2.62-63"
day: 10
theme: mind
illustration: ladder-of-fall
related: ["16.21", "6.5", "2.56"]
en:
  title: "The ladder of fall"
  essence: "One small thought, left unchecked, can pull a person all the way down."
  meaning: >-
    When a person keeps dwelling on objects, attachment to them grows. From
    attachment comes desire; from unfulfilled desire, anger. From anger comes
    delusion; from delusion, confusion of memory; from that, loss of
    judgement — and with the loss of judgement, one is ruined.
  student: >-
    "I'll just check one video" → "one more" → irritation when a parent says
    stop → a lost evening → a missed test. The chain is easiest to break at
    the very first step — before you pick up the phone.
  home: >-
    A small hurt replayed over and over becomes resentment, then a harsh
    word, then a family rift that lasts years. Talk about the hurt early,
    before it climbs down the ladder.
  work: >-
    Brooding over a colleague's promotion turns into envy, then irritation in
    meetings, then poor decisions. Notice the brooding; redirect it into your
    own growth plan.
  story:
    title: "Duryodhana at the Hall of Illusions"
    source: "Mahabharata, Sabha Parva"
    text: >-
      Visiting the Pandavas' magnificent new palace, Duryodhana mistook a
      polished floor for a pool and a pool for a floor, and fell into the
      water. The Pandavas laughed. He went home and could not stop thinking
      about their wealth and the laughter. Brooding turned to burning desire,
      desire to rage, rage to the rigged game of dice — and in the end, to the
      war that destroyed his family.
    connection: >-
      The ruin did not begin at Kurukshetra. It began with a thought he would
      not let go of.
  misreading: >-
    "Never enjoy anything." No — the problem is not enjoying things, but
    obsessive dwelling that lets desire and anger take charge.
  practice: >-
    Today, notice one thought you keep returning to. Ask "Which step of the
    ladder am I on?" and consciously turn your attention elsewhere.
kn:
  title: "ಅಧಃಪತನದ ಏಣಿ"
  essence: "ಒಂದು ಸಣ್ಣ ಆಲೋಚನೆ, ತಡೆಯದಿದ್ದರೆ, ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಕೆಳಗೆಳೆಯಬಲ್ಲದು."
  meaning: >-
    ವಿಷಯಗಳನ್ನೇ ಧ್ಯಾನಿಸುವವನಿಗೆ ಅವುಗಳಲ್ಲಿ ಆಸಕ್ತಿ ಹುಟ್ಟುತ್ತದೆ. ಆಸಕ್ತಿಯಿಂದ ಕಾಮ,
    ಕಾಮದಿಂದ ಕ್ರೋಧ ಹುಟ್ಟುತ್ತದೆ. ಕ್ರೋಧದಿಂದ ಸಮ್ಮೋಹ, ಸಮ್ಮೋಹದಿಂದ ಸ್ಮೃತಿಭ್ರಮೆ,
    ಸ್ಮೃತಿಭ್ರಂಶದಿಂದ ಬುದ್ಧಿನಾಶ — ಬುದ್ಧಿನಾಶದಿಂದ ಅವನು ನಾಶವಾಗುತ್ತಾನೆ.
  student: >-
    "ಒಂದೇ ವಿಡಿಯೋ ನೋಡ್ತೀನಿ" → "ಇನ್ನೊಂದು" → ಅಪ್ಪ-ಅಮ್ಮ ನಿಲ್ಲಿಸು ಎಂದಾಗ ಕೋಪ →
    ಕಳೆದುಹೋದ ಸಂಜೆ → ಹಾಳಾದ ಪರೀಕ್ಷೆ. ಈ ಸರಪಳಿಯನ್ನು ಮೊದಲ ಹೆಜ್ಜೆಯಲ್ಲೇ ಮುರಿಯುವುದು
    ಸುಲಭ — ಫೋನ್ ಕೈಗೆತ್ತಿಕೊಳ್ಳುವ ಮೊದಲೇ.
  home: >-
    ಮತ್ತೆ ಮತ್ತೆ ನೆನಪಿಸಿಕೊಂಡ ಒಂದು ಸಣ್ಣ ನೋವು ಅಸಮಾಧಾನವಾಗಿ, ನಂತರ ಕಠಿಣ ಮಾತಾಗಿ,
    ನಂತರ ವರ್ಷಗಟ್ಟಲೆ ಉಳಿಯುವ ಕುಟುಂಬದ ಬಿರುಕಾಗುತ್ತದೆ. ಅದು ಏಣಿಯಿಂದ ಕೆಳಗಿಳಿಯುವ
    ಮುನ್ನವೇ ನೋವಿನ ಬಗ್ಗೆ ಮಾತನಾಡಿ.
  work: >-
    ಸಹೋದ್ಯೋಗಿಯ ಬಡ್ತಿಯ ಬಗ್ಗೆ ಚಿಂತಿಸುತ್ತಾ ಕುಳಿತರೆ ಅದು ಅಸೂಯೆಯಾಗಿ, ಸಭೆಗಳಲ್ಲಿ ಸಿಡುಕಾಗಿ,
    ಕೆಟ್ಟ ನಿರ್ಧಾರಗಳಾಗುತ್ತದೆ. ಆ ಚಿಂತನೆಯನ್ನು ಗುರುತಿಸಿ; ಅದನ್ನು ನಿಮ್ಮ ಸ್ವಂತ ಬೆಳವಣಿಗೆಯ
    ಯೋಜನೆಯತ್ತ ತಿರುಗಿಸಿ.
  story:
    title: "ಮಯಸಭೆಯಲ್ಲಿ ದುರ್ಯೋಧನ"
    source: "ಮಹಾಭಾರತ, ಸಭಾಪರ್ವ"
    text: >-
      ಪಾಂಡವರ ಭವ್ಯ ಹೊಸ ಅರಮನೆಗೆ ಭೇಟಿ ನೀಡಿದ ದುರ್ಯೋಧನ, ನುಣುಪಾದ ನೆಲವನ್ನು ಕೊಳವೆಂದೂ
      ಕೊಳವನ್ನು ನೆಲವೆಂದೂ ಭ್ರಮಿಸಿ ನೀರಿಗೆ ಬಿದ್ದನು. ಪಾಂಡವರು ನಕ್ಕರು. ಮನೆಗೆ ಮರಳಿದ ಅವನು
      ಅವರ ಸಂಪತ್ತು ಮತ್ತು ನಗುವಿನ ಬಗ್ಗೆ ಯೋಚಿಸುವುದನ್ನು ನಿಲ್ಲಿಸಲೇ ಇಲ್ಲ. ಚಿಂತನೆ ತೀವ್ರ
      ಬಯಕೆಯಾಯಿತು, ಬಯಕೆ ಕ್ರೋಧವಾಯಿತು, ಕ್ರೋಧ ಮೋಸದ ಪಗಡೆಯಾಟವಾಯಿತು — ಕೊನೆಗೆ ಅವನ
      ಕುಲವನ್ನೇ ನಾಶಮಾಡಿದ ಯುದ್ಧವಾಯಿತು.
    connection: >-
      ವಿನಾಶ ಕುರುಕ್ಷೇತ್ರದಲ್ಲಿ ಆರಂಭವಾಗಲಿಲ್ಲ. ಅವನು ಬಿಡಲೊಲ್ಲದ ಒಂದು ಆಲೋಚನೆಯಿಂದ ಆರಂಭವಾಯಿತು.
  misreading: >-
    "ಯಾವುದನ್ನೂ ಆನಂದಿಸಬೇಡ" ಎಂದಲ್ಲ. ಸಮಸ್ಯೆ ಆನಂದದಲ್ಲಲ್ಲ; ಬಯಕೆ ಮತ್ತು ಕ್ರೋಧ ಹಿಡಿತ
    ಪಡೆಯುವಂತೆ ಮಾಡುವ ಗೀಳಿನ ಚಿಂತನೆಯಲ್ಲಿ.
  practice: >-
    ಇಂದು ನೀವು ಮತ್ತೆ ಮತ್ತೆ ಮರಳುವ ಒಂದು ಆಲೋಚನೆಯನ್ನು ಗಮನಿಸಿ. "ನಾನು ಏಣಿಯ ಯಾವ
    ಮೆಟ್ಟಿಲಿನಲ್ಲಿದ್ದೇನೆ?" ಎಂದು ಕೇಳಿಕೊಂಡು, ಜಾಗೃತವಾಗಿ ಗಮನವನ್ನು ಬೇರೆಡೆಗೆ ತಿರುಗಿಸಿ.
