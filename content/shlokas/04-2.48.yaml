ref: "2.48"
day: 4
theme: work
illustration: balance-scale
related: ["2.47", "2.56", "2.14"]
en:
  title: "Evenness of mind is yoga"
  essence: "Work steadily, whether it ends in success or failure."
  meaning: >-
    Established in yoga, do your work, giving up clinging attachment. Stay the
    same in success and failure. This evenness of mind is called yoga.
  student: >-
    One test goes brilliantly, the next goes badly. If a good mark makes you
    careless and a bad mark makes you give up, your marks are running your
    life. Keep the same study rhythm through both.
  home: >-
    Festivals and hospital visits, a new job and a lost one — every home goes
    through both. The family member who stays steady in both becomes the
    anchor everyone else holds on to.
  work: >-
    Don't over-celebrate a big win or collapse after a missed target. Leaders
    who respond to both with the same calm, clear review earn lasting trust
    from their teams.
  story:
    title: "Rama's unchanged face"
    source: "Valmiki Ramayana, Ayodhya Kanda"
    text: >-
      On the evening before his coronation, Rama was told he would be king.
      The next morning he was told instead that he must go to the forest for
      fourteen years. Valmiki describes that Rama's face showed no change —
      neither the joy of the crown nor the grief of exile could shake his
      calm. He comforted his mother and brother, and went.
    connection: >-
      Rama felt deeply, but his steadiness did not depend on what happened to
      him. That is samatva — evenness.
  misreading: >-
    "Don't feel anything." No — equanimity is not numbness. You can feel joy
    and pain fully while your judgement and effort stay steady.
  practice: >-
    Today, when something goes well or badly, pause for three breaths before
    reacting, and ask: "What is my next right step?"
kn:
  title: "ಸಮತ್ವವೇ ಯೋಗ"
  essence: "ಗೆಲುವಾಗಲಿ ಸೋಲಾಗಲಿ, ಸ್ಥಿರ ಮನಸ್ಸಿನಿಂದ ಕೆಲಸ ಮಾಡು."
  meaning: >-
    ಯೋಗದಲ್ಲಿ ನೆಲೆನಿಂತು, ಆಸಕ್ತಿಯನ್ನು ತೊರೆದು ಕರ್ಮಗಳನ್ನು ಮಾಡು. ಸಿದ್ಧಿ-ಅಸಿದ್ಧಿಗಳಲ್ಲಿ
    ಸಮನಾಗಿರು. ಈ ಸಮಭಾವವನ್ನೇ ಯೋಗ ಎನ್ನುತ್ತಾರೆ.
  student: >-
    ಒಂದು ಪರೀಕ್ಷೆ ಚೆನ್ನಾಗಿ ಆಗುತ್ತದೆ, ಮುಂದಿನದು ಕೆಟ್ಟದಾಗಿ. ಒಳ್ಳೆಯ ಅಂಕ ನಿಮ್ಮನ್ನು
    ಅಸಡ್ಡೆಗೊಳಿಸಿದರೆ, ಕೆಟ್ಟ ಅಂಕ ನಿಮ್ಮನ್ನು ಕೈಚೆಲ್ಲುವಂತೆ ಮಾಡಿದರೆ — ಅಂಕಗಳೇ ನಿಮ್ಮ
    ಬದುಕನ್ನು ನಡೆಸುತ್ತಿವೆ. ಎರಡರಲ್ಲೂ ಒಂದೇ ಓದಿನ ಲಯವನ್ನು ಕಾಪಾಡಿ.
  home: >-
    ಹಬ್ಬಗಳು ಮತ್ತು ಆಸ್ಪತ್ರೆ ಭೇಟಿಗಳು, ಹೊಸ ಉದ್ಯೋಗ ಮತ್ತು ಕಳೆದುಹೋದ ಉದ್ಯೋಗ — ಪ್ರತಿ
    ಮನೆಯೂ ಎರಡನ್ನೂ ಕಾಣುತ್ತದೆ. ಎರಡರಲ್ಲೂ ಸ್ಥಿರವಾಗಿರುವವರು ಮನೆಯವರೆಲ್ಲರಿಗೂ
    ಆಧಾರಸ್ತಂಭವಾಗುತ್ತಾರೆ.
  work: >-
    ದೊಡ್ಡ ಗೆಲುವನ್ನು ಅತಿಯಾಗಿ ಆಚರಿಸಬೇಡಿ, ಗುರಿ ತಪ್ಪಿದಾಗ ಕುಸಿಯಬೇಡಿ. ಎರಡಕ್ಕೂ ಒಂದೇ
    ಶಾಂತ, ಸ್ಪಷ್ಟ ಪರಿಶೀಲನೆಯಿಂದ ಸ್ಪಂದಿಸುವ ನಾಯಕರು ತಂಡದ ಶಾಶ್ವತ ನಂಬಿಕೆ ಗಳಿಸುತ್ತಾರೆ.
  story:
    title: "ಬದಲಾಗದ ರಾಮನ ಮುಖ"
    source: "ವಾಲ್ಮೀಕಿ ರಾಮಾಯಣ, ಅಯೋಧ್ಯಾಕಾಂಡ"
    text: >-
      ಪಟ್ಟಾಭಿಷೇಕದ ಹಿಂದಿನ ಸಂಜೆ ರಾಮನಿಗೆ "ನೀನು ರಾಜನಾಗುವೆ" ಎಂದು ಹೇಳಲಾಯಿತು. ಮರುದಿನ
      ಬೆಳಿಗ್ಗೆ "ಹದಿನಾಲ್ಕು ವರ್ಷ ವನವಾಸಕ್ಕೆ ಹೋಗಬೇಕು" ಎಂದು ಹೇಳಲಾಯಿತು. ರಾಮನ ಮುಖದಲ್ಲಿ
      ಯಾವ ಬದಲಾವಣೆಯೂ ಕಾಣಲಿಲ್ಲ ಎಂದು ವಾಲ್ಮೀಕಿ ವರ್ಣಿಸುತ್ತಾರೆ — ಕಿರೀಟದ ಸಂತೋಷವಾಗಲಿ,
      ವನವಾಸದ ದುಃಖವಾಗಲಿ ಅವನ ಶಾಂತಿಯನ್ನು ಕದಲಿಸಲಿಲ್ಲ. ತಾಯಿಯನ್ನೂ ತಮ್ಮನನ್ನೂ
      ಸಮಾಧಾನಪಡಿಸಿ ಅವನು ಹೊರಟನು.
    connection: >-
      ರಾಮನಿಗೆ ಆಳವಾದ ಭಾವನೆಗಳಿದ್ದವು, ಆದರೆ ಅವನ ಸ್ಥಿರತೆ ತನಗೆ ಏನಾಗುತ್ತದೆ ಎಂಬುದರ ಮೇಲೆ
      ಅವಲಂಬಿತವಾಗಿರಲಿಲ್ಲ. ಇದೇ ಸಮತ್ವ.
  misreading: >-
    "ಏನನ್ನೂ ಅನುಭವಿಸಬೇಡ" ಎಂದಲ್ಲ. ಸಮತ್ವ ಎಂದರೆ ಜಡತೆಯಲ್ಲ. ಸಂತೋಷ-ದುಃಖಗಳನ್ನು
    ಪೂರ್ಣವಾಗಿ ಅನುಭವಿಸುತ್ತಲೇ ವಿವೇಕ ಮತ್ತು ಪ್ರಯತ್ನ ಸ್ಥಿರವಾಗಿರಲಿ.
  practice: >-
    ಇಂದು ಏನಾದರೂ ಒಳ್ಳೆಯದು ಅಥವಾ ಕೆಟ್ಟದು ಸಂಭವಿಸಿದಾಗ, ಪ್ರತಿಕ್ರಿಯಿಸುವ ಮುನ್ನ ಮೂರು
    ಉಸಿರು ನಿಲ್ಲಿಸಿ ಕೇಳಿಕೊಳ್ಳಿ: "ನನ್ನ ಮುಂದಿನ ಸರಿಯಾದ ಹೆಜ್ಜೆ ಯಾವುದು?"
