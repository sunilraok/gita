ref: "18.48"
day: 6
theme: work
illustration: lamp-smoke
related: ["3.35", "2.47", "2.40"]
en:
  title: "Every fire has some smoke"
  essence: "No work is flawless. Don't abandon your duty because it has faults."
  meaning: >-
    One should not give up the work that suits one's nature, even if it has
    defects. For every undertaking is covered by some fault, just as fire is
    covered by smoke.
  student: >-
    Every subject has boring chapters, every college has flaws, every teacher
    has an off day. Looking for a perfect situation before you commit is a
    trap. Work with what you have.
  home: >-
    Every family has its quirks, and every home has chores nobody likes.
    Accepting the smoke along with the warmth of the fire is what keeps a
    household together.
  work: >-
    The dream job also has boring reports, difficult colleagues and office
    politics. Before quitting, ask: "Is this the smoke of every fire, or is
    the fire itself wrong for me?"
  story:
    title: "Meena's 'perfect' job"
    source: "Illustrative story"
    text: >-
      Meena left three jobs in two years — one for a strict manager, one for
      long hours, one for a dull project. At the fourth, she noticed that the
      same complaints had followed her. An older colleague told her, "Every
      job has smoke. Choose a fire that warms you, then learn to live with the
      smoke." She stayed, grew into a lead role, and later fixed some of the
      very problems she had once run from.
    connection: >-
      Running from every imperfection means never building anything.
  misreading: >-
    "Tolerate anything, even abuse or wrongdoing." No — the verse is about the
    normal imperfections of good work, not about accepting what is unethical
    or harmful.
  practice: >-
    List two frustrating parts of your study or work. For each, write:
    "normal smoke" or "real problem to fix". Act only on the second.
kn:
  title: "ಪ್ರತಿ ಬೆಂಕಿಗೂ ಹೊಗೆ ಇರುತ್ತದೆ"
  essence: "ಯಾವ ಕೆಲಸವೂ ದೋಷರಹಿತವಲ್ಲ. ದೋಷವಿದೆ ಎಂದು ಕರ್ತವ್ಯವನ್ನು ಬಿಡಬೇಡ."
  meaning: >-
    ಸ್ವಭಾವಕ್ಕೆ ತಕ್ಕ ಕರ್ಮವನ್ನು ದೋಷವಿದ್ದರೂ ಬಿಡಬಾರದು. ಬೆಂಕಿ ಹೊಗೆಯಿಂದ
    ಆವರಿಸಿರುವಂತೆ, ಎಲ್ಲಾ ಕಾರ್ಯಗಳೂ ಯಾವುದಾದರೊಂದು ದೋಷದಿಂದ ಕೂಡಿರುತ್ತವೆ.
  student: >-
    ಪ್ರತಿ ವಿಷಯದಲ್ಲೂ ಬೇಸರದ ಅಧ್ಯಾಯಗಳಿರುತ್ತವೆ, ಪ್ರತಿ ಕಾಲೇಜಿನಲ್ಲೂ ಕೊರತೆಗಳಿರುತ್ತವೆ,
    ಪ್ರತಿ ಶಿಕ್ಷಕರಿಗೂ ಕೆಟ್ಟ ದಿನವಿರುತ್ತದೆ. ಪರಿಪೂರ್ಣ ಪರಿಸ್ಥಿತಿಗಾಗಿ ಕಾಯುವುದು ಒಂದು
    ಬಲೆ. ಇರುವುದರಲ್ಲೇ ಕೆಲಸ ಮಾಡಿ.
  home: >-
    ಪ್ರತಿ ಕುಟುಂಬಕ್ಕೂ ತನ್ನದೇ ವಿಚಿತ್ರಗಳಿರುತ್ತವೆ, ಪ್ರತಿ ಮನೆಯಲ್ಲೂ ಯಾರಿಗೂ ಇಷ್ಟವಿಲ್ಲದ
    ಕೆಲಸಗಳಿರುತ್ತವೆ. ಬೆಂಕಿಯ ಬೆಚ್ಚನೆಯೊಂದಿಗೆ ಹೊಗೆಯನ್ನೂ ಸ್ವೀಕರಿಸುವುದೇ ಮನೆಯನ್ನು
    ಒಗ್ಗಟ್ಟಾಗಿಡುತ್ತದೆ.
  work: >-
    ಕನಸಿನ ಉದ್ಯೋಗದಲ್ಲೂ ಬೇಸರದ ವರದಿಗಳು, ಕಷ್ಟದ ಸಹೋದ್ಯೋಗಿಗಳು, ಕಚೇರಿ ರಾಜಕೀಯ ಇರುತ್ತವೆ.
    ಕೆಲಸ ಬಿಡುವ ಮುನ್ನ ಕೇಳಿಕೊಳ್ಳಿ: "ಇದು ಎಲ್ಲಾ ಬೆಂಕಿಯ ಹೊಗೆಯೇ, ಅಥವಾ ಈ ಬೆಂಕಿಯೇ
    ನನಗೆ ಸರಿಯಲ್ಲವೇ?"
  story:
    title: "ಮೀನಾಳ 'ಪರಿಪೂರ್ಣ' ಉದ್ಯೋಗ"
    source: "ದೃಷ್ಟಾಂತ ಕಥೆ"
    text: >-
      ಮೀನಾ ಎರಡು ವರ್ಷಗಳಲ್ಲಿ ಮೂರು ಉದ್ಯೋಗ ಬಿಟ್ಟಳು — ಒಂದು ಕಟ್ಟುನಿಟ್ಟಿನ ಮ್ಯಾನೇಜರ್‌ಗಾಗಿ,
      ಒಂದು ದೀರ್ಘ ಗಂಟೆಗಳಿಗಾಗಿ, ಒಂದು ಬೇಸರದ ಪ್ರಾಜೆಕ್ಟ್‌ಗಾಗಿ. ನಾಲ್ಕನೆಯದರಲ್ಲಿ, ಅದೇ
      ದೂರುಗಳು ತನ್ನನ್ನು ಹಿಂಬಾಲಿಸಿ ಬಂದಿರುವುದನ್ನು ಅವಳು ಗಮನಿಸಿದಳು. ಹಿರಿಯ
      ಸಹೋದ್ಯೋಗಿಯೊಬ್ಬರು ಹೇಳಿದರು: "ಪ್ರತಿ ಕೆಲಸಕ್ಕೂ ಹೊಗೆ ಇರುತ್ತದೆ. ನಿನ್ನನ್ನು ಬೆಚ್ಚಗಿಡುವ
      ಬೆಂಕಿಯನ್ನು ಆರಿಸಿಕೊ, ನಂತರ ಹೊಗೆಯೊಂದಿಗೆ ಬದುಕಲು ಕಲಿ." ಅವಳು ಉಳಿದಳು, ತಂಡದ
      ನಾಯಕಿಯಾಗಿ ಬೆಳೆದಳು, ಒಮ್ಮೆ ತಾನು ಓಡಿಹೋಗಿದ್ದ ಸಮಸ್ಯೆಗಳನ್ನೇ ನಂತರ ಸರಿಪಡಿಸಿದಳು.
    connection: >-
      ಪ್ರತಿಯೊಂದು ಅಪೂರ್ಣತೆಯಿಂದ ಓಡಿಹೋದರೆ ಏನನ್ನೂ ಕಟ್ಟಲಾಗುವುದಿಲ್ಲ.
  misreading: >-
    "ಏನನ್ನಾದರೂ ಸಹಿಸಿಕೊ — ದೌರ್ಜನ್ಯ, ಅನ್ಯಾಯವನ್ನೂ" ಎಂದಲ್ಲ. ಒಳ್ಳೆಯ ಕೆಲಸದ ಸಹಜ
    ಅಪೂರ್ಣತೆಗಳ ಬಗ್ಗೆ ಈ ಶ್ಲೋಕ ಹೇಳುತ್ತದೆ, ಅನೈತಿಕ ಅಥವಾ ಹಾನಿಕರವಾದುದನ್ನು ಒಪ್ಪುವ ಬಗ್ಗೆ ಅಲ್ಲ.
  practice: >-
    ನಿಮ್ಮ ಓದು ಅಥವಾ ಕೆಲಸದ ಎರಡು ಕಿರಿಕಿರಿಯ ಅಂಶಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡಿ. ಪ್ರತಿಯೊಂದಕ್ಕೂ
    "ಸಹಜ ಹೊಗೆ" ಅಥವಾ "ಸರಿಪಡಿಸಬೇಕಾದ ನಿಜ ಸಮಸ್ಯೆ" ಎಂದು ಬರೆಯಿರಿ. ಎರಡನೆಯದರ ಮೇಲೆ ಮಾತ್ರ ಕ್ರಮ ಕೈಗೊಳ್ಳಿ.
