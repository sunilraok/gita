ref: "6.35"
day: 9
theme: mind
illustration: boat-oars
related: ["6.5", "2.40", "2.50"]
en:
  title: "Practice and letting go tame the mind"
  essence: "The mind is restless — but steady practice and detachment bring it under control."
  meaning: >-
    Krishna said: Without doubt, O mighty-armed one, the mind is restless and
    hard to control. But it can be held through practice and detachment.
  student: >-
    Your phone buzzes, your mind drifts, you read the same paragraph three
    times. That's normal — even Arjuna complained about it (6.34). Practice:
    short focused sessions, daily. Detachment: phone in another room.
  home: >-
    Habits at home — screen time, overeating, irritability — change through
    small repeated practice and letting go of the pull, not through one big
    resolution on New Year's day.
  work: >-
    Deep work is a trainable skill. Block a focused hour, turn off
    notifications, and return to the task each time you drift. The returning
    *is* the practice.
  story:
    title: "Arjuna practises in the dark"
    source: "Mahabharata, Adi Parva"
    text: >-
      One night, as Bhima was eating, a gust of wind blew out the lamp. Bhima
      kept eating in the dark — his hand found his mouth by habit. Arjuna,
      watching, realised that practice could make the hand accurate even
      without sight. From then on he practised archery at night, until he
      could hit targets in darkness.
    connection: >-
      Abhyasa — steady, repeated practice — makes the impossible natural. Even
      a restless mind can be trained the same way.
  misreading: >-
    "A good person has no distractions." No — Krishna openly agrees the mind is
    restless. The goal is not a perfect mind but a trained one.
  practice: >-
    Set a 20-minute timer and work on one thing. Each time your mind wanders,
    gently bring it back and make a tally mark. Aim for fewer marks tomorrow.
kn:
  title: "ಅಭ್ಯಾಸ ಮತ್ತು ವೈರಾಗ್ಯದಿಂದ ಮನಸ್ಸು ವಶ"
  essence: "ಮನಸ್ಸು ಚಂಚಲ — ಆದರೆ ನಿರಂತರ ಅಭ್ಯಾಸ ಮತ್ತು ವೈರಾಗ್ಯದಿಂದ ಅದನ್ನು ಹಿಡಿತಕ್ಕೆ ತರಬಹುದು."
  meaning: >-
    ಶ್ರೀಕೃಷ್ಣ ಹೇಳಿದನು: ಓ ಮಹಾಬಾಹುವೇ, ಮನಸ್ಸು ಚಂಚಲ, ನಿಗ್ರಹಿಸಲು ಕಷ್ಟ ಎಂಬುದರಲ್ಲಿ
    ಸಂಶಯವಿಲ್ಲ. ಆದರೆ ಅಭ್ಯಾಸ ಮತ್ತು ವೈರಾಗ್ಯದಿಂದ ಅದನ್ನು ಹಿಡಿಯಬಹುದು.
  student: >-
    ಫೋನ್ ಸದ್ದು ಮಾಡುತ್ತದೆ, ಮನಸ್ಸು ಅಲೆಯುತ್ತದೆ, ಒಂದೇ ಪ್ಯಾರಾವನ್ನು ಮೂರು ಬಾರಿ
    ಓದುತ್ತೀರಿ. ಇದು ಸಹಜ — ಅರ್ಜುನನೂ ಇದರ ಬಗ್ಗೆ ದೂರಿದ್ದ (6.34). ಅಭ್ಯಾಸ: ಪ್ರತಿದಿನ
    ಸಣ್ಣ ಏಕಾಗ್ರ ಅವಧಿಗಳು. ವೈರಾಗ್ಯ: ಫೋನ್ ಬೇರೆ ಕೋಣೆಯಲ್ಲಿ.
  home: >-
    ಮನೆಯ ಅಭ್ಯಾಸಗಳು — ಪರದೆ ಸಮಯ, ಅತಿಯಾಗಿ ತಿನ್ನುವುದು, ಸಿಡುಕು — ಹೊಸ ವರ್ಷದ ಒಂದು
    ದೊಡ್ಡ ಸಂಕಲ್ಪದಿಂದಲ್ಲ, ಪುನರಾವರ್ತಿತ ಸಣ್ಣ ಅಭ್ಯಾಸ ಮತ್ತು ಸೆಳೆತವನ್ನು ಬಿಡುವುದರಿಂದ ಬದಲಾಗುತ್ತವೆ.
  work: >-
    ಆಳವಾದ ಏಕಾಗ್ರ ಕೆಲಸ ತರಬೇತಿ ಮಾಡಬಹುದಾದ ಕೌಶಲ. ಒಂದು ಗಂಟೆ ಮೀಸಲಿಡಿ, ನೋಟಿಫಿಕೇಶನ್
    ಆಫ್ ಮಾಡಿ, ಮನಸ್ಸು ಅಲೆದಾಗಲೆಲ್ಲಾ ಕೆಲಸಕ್ಕೆ ಮರಳಿ. ಆ ಮರಳುವಿಕೆಯೇ ಅಭ್ಯಾಸ.
  story:
    title: "ಕತ್ತಲಲ್ಲಿ ಅರ್ಜುನನ ಅಭ್ಯಾಸ"
    source: "ಮಹಾಭಾರತ, ಆದಿಪರ್ವ"
    text: >-
      ಒಂದು ರಾತ್ರಿ ಭೀಮ ಊಟ ಮಾಡುತ್ತಿದ್ದಾಗ ಗಾಳಿಗೆ ದೀಪ ಆರಿಹೋಯಿತು. ಭೀಮ ಕತ್ತಲಲ್ಲೂ ಊಟ
      ಮುಂದುವರಿಸಿದ — ಅಭ್ಯಾಸದಿಂದ ಕೈ ಬಾಯಿಗೆ ಸರಿಯಾಗಿ ತಲುಪುತ್ತಿತ್ತು. ಇದನ್ನು ನೋಡಿದ
      ಅರ್ಜುನ, ಅಭ್ಯಾಸವಿದ್ದರೆ ಕಣ್ಣಿಲ್ಲದೆಯೂ ಕೈ ನಿಖರವಾಗಬಲ್ಲದು ಎಂದು ಅರಿತ. ಅಂದಿನಿಂದ
      ರಾತ್ರಿ ಬಿಲ್ಲುವಿದ್ಯೆ ಅಭ್ಯಾಸ ಮಾಡಿ, ಕತ್ತಲಲ್ಲೂ ಗುರಿ ಹೊಡೆಯುವಷ್ಟು ನಿಪುಣನಾದ.
    connection: >-
      ಅಭ್ಯಾಸ — ಸ್ಥಿರ, ಪುನರಾವರ್ತಿತ ಪ್ರಯತ್ನ — ಅಸಾಧ್ಯವನ್ನು ಸಹಜವಾಗಿಸುತ್ತದೆ. ಚಂಚಲ
      ಮನಸ್ಸನ್ನೂ ಹೀಗೆಯೇ ತರಬೇತಿಗೊಳಿಸಬಹುದು.
  misreading: >-
    "ಒಳ್ಳೆಯವರಿಗೆ ಯಾವ ಚಂಚಲತೆಯೂ ಇರುವುದಿಲ್ಲ" ಎಂದಲ್ಲ. ಮನಸ್ಸು ಚಂಚಲ ಎಂದು ಕೃಷ್ಣನೇ
    ಒಪ್ಪುತ್ತಾನೆ. ಗುರಿ ಪರಿಪೂರ್ಣ ಮನಸ್ಸಲ್ಲ, ತರಬೇತಾದ ಮನಸ್ಸು.
  practice: >-
    20 ನಿಮಿಷದ ಟೈಮರ್ ಇಟ್ಟು ಒಂದೇ ಕೆಲಸ ಮಾಡಿ. ಮನಸ್ಸು ಅಲೆದಾಗಲೆಲ್ಲಾ ಮೃದುವಾಗಿ ಮರಳಿ
    ತಂದು ಒಂದು ಗುರುತು ಹಾಕಿ. ನಾಳೆ ಕಡಿಮೆ ಗುರುತುಗಳ ಗುರಿ ಇಡಿ.
