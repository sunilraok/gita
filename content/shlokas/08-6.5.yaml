ref: "6.5"
day: 8
theme: mind
illustration: mind-dial
related: ["6.35", "2.62-63", "2.40"]
en:
  title: "Lift yourself by yourself"
  essence: "Your own mind can be your best friend or your worst enemy."
  meaning: >-
    Lift yourself up by your own mind; do not let yourself sink down. For the
    mind alone is the friend of the self, and the mind alone is its enemy.
  student: >-
    Nobody can study for you. The inner voice that says "I'm just bad at maths"
    is an enemy; the voice that says "I haven't learned this *yet*" is a friend.
    Choose which one you feed.
  home: >-
    Parents and elders can support, but they cannot change someone who does
    not want to change. Model self-improvement at home — learning something
    new at 50 teaches children more than any lecture.
  work: >-
    Waiting for the company, the manager or luck to rescue your career keeps
    you stuck. Take ownership: ask for feedback, learn the next skill, build
    the habit. Your growth is your job.
  story:
    title: "Ratnakara becomes Valmiki"
    source: "Puranic and folk tradition"
    text: >-
      Tradition says the poet Valmiki was once Ratnakara, a highway robber who
      supported his family by looting travellers. When he learned that his
      family would share his wealth but not the burden of his wrongdoing, he
      was shaken. He sat in meditation so long that an anthill (valmika) grew
      over him — and he rose as the sage who gave the world the Ramayana.
    connection: >-
      The same mind that led him astray became the mind that lifted him up.
      No one is too far gone to turn around.
  misreading: >-
    "Never ask for help — do it alone." No — the Gita itself is a dialogue with
    a guide. The point is that the decision to rise must be your own.
  practice: >-
    Catch one negative sentence you say about yourself today. Rewrite it in a
    friend's voice and say that version aloud.
kn:
  title: "ನಿನ್ನನ್ನು ನೀನೇ ಉದ್ಧರಿಸಿಕೊ"
  essence: "ನಿನ್ನ ಮನಸ್ಸೇ ನಿನ್ನ ಅತ್ಯುತ್ತಮ ಮಿತ್ರ ಅಥವಾ ಕೆಟ್ಟ ಶತ್ರು ಆಗಬಲ್ಲದು."
  meaning: >-
    ತನ್ನಿಂದ ತಾನೇ ತನ್ನನ್ನು ಮೇಲಕ್ಕೆತ್ತಿಕೊಳ್ಳಬೇಕು; ತನ್ನನ್ನು ಕುಸಿಯಲು ಬಿಡಬಾರದು.
    ಏಕೆಂದರೆ ತಾನೇ ತನಗೆ ಬಂಧು, ತಾನೇ ತನಗೆ ಶತ್ರು.
  student: >-
    ನಿಮ್ಮ ಬದಲು ಯಾರೂ ಓದಲಾರರು. "ನಾನು ಗಣಿತದಲ್ಲಿ ದಡ್ಡ" ಎನ್ನುವ ಒಳಧ್ವನಿ ಶತ್ರು;
    "ನಾನು ಇದನ್ನು ಇನ್ನೂ ಕಲಿತಿಲ್ಲ" ಎನ್ನುವ ಧ್ವನಿ ಮಿತ್ರ. ಯಾವುದನ್ನು ಬೆಳೆಸುತ್ತೀರಿ ಎಂದು ಆರಿಸಿ.
  home: >-
    ತಂದೆ-ತಾಯಿ, ಹಿರಿಯರು ನೆರವಾಗಬಹುದು, ಆದರೆ ಬದಲಾಗಲು ಇಷ್ಟವಿಲ್ಲದವರನ್ನು ಬದಲಿಸಲಾರರು.
    ಮನೆಯಲ್ಲಿ ಸ್ವ-ಸುಧಾರಣೆಗೆ ಮಾದರಿಯಾಗಿ — 50ರ ವಯಸ್ಸಿನಲ್ಲಿ ಹೊಸದನ್ನು ಕಲಿಯುವುದು ಯಾವ
    ಉಪದೇಶಕ್ಕಿಂತಲೂ ಮಕ್ಕಳಿಗೆ ಹೆಚ್ಚು ಕಲಿಸುತ್ತದೆ.
  work: >-
    ಕಂಪನಿ, ಮ್ಯಾನೇಜರ್ ಅಥವಾ ಅದೃಷ್ಟ ನಿಮ್ಮ ವೃತ್ತಿಜೀವನವನ್ನು ಕಾಪಾಡಲಿ ಎಂದು ಕಾಯುವುದು
    ನಿಮ್ಮನ್ನು ನಿಂತಲ್ಲೇ ನಿಲ್ಲಿಸುತ್ತದೆ. ಹೊಣೆ ಹೊತ್ತುಕೊಳ್ಳಿ: ಪ್ರತಿಕ್ರಿಯೆ ಕೇಳಿ, ಮುಂದಿನ
    ಕೌಶಲ ಕಲಿಯಿರಿ, ಅಭ್ಯಾಸ ಬೆಳೆಸಿ. ನಿಮ್ಮ ಬೆಳವಣಿಗೆ ನಿಮ್ಮ ಕೆಲಸ.
  story:
    title: "ರತ್ನಾಕರ ವಾಲ್ಮೀಕಿಯಾದದ್ದು"
    source: "ಪುರಾಣ ಮತ್ತು ಜನಪದ ಪರಂಪರೆ"
    text: >-
      ಕವಿ ವಾಲ್ಮೀಕಿ ಒಮ್ಮೆ ರತ್ನಾಕರ ಎಂಬ ದಾರಿಗಳ್ಳನಾಗಿದ್ದು, ಪ್ರಯಾಣಿಕರನ್ನು ದೋಚಿ ಕುಟುಂಬ
      ಸಾಕುತ್ತಿದ್ದ ಎಂದು ಪರಂಪರೆ ಹೇಳುತ್ತದೆ. ತನ್ನ ಕುಟುಂಬ ಸಂಪತ್ತಿನಲ್ಲಿ ಪಾಲು ಪಡೆಯುತ್ತದೆ,
      ಆದರೆ ಪಾಪದಲ್ಲಿ ಅಲ್ಲ ಎಂದು ತಿಳಿದಾಗ ಅವನು ಬೆಚ್ಚಿಬಿದ್ದ. ಅವನು ಎಷ್ಟು ದೀರ್ಘಕಾಲ
      ಧ್ಯಾನದಲ್ಲಿ ಕುಳಿತನೆಂದರೆ ಅವನ ಮೇಲೆ ಹುತ್ತ (ವಲ್ಮೀಕ) ಬೆಳೆಯಿತು — ಅದರಿಂದ ಎದ್ದು
      ಜಗತ್ತಿಗೆ ರಾಮಾಯಣ ನೀಡಿದ ಮಹರ್ಷಿಯಾದ.
    connection: >-
      ಅವನನ್ನು ದಾರಿ ತಪ್ಪಿಸಿದ ಅದೇ ಮನಸ್ಸು ಅವನನ್ನು ಮೇಲಕ್ಕೆತ್ತಿತು. ಹಿಂತಿರುಗಲು ಯಾರಿಗೂ
      ತಡವಾಗಿಲ್ಲ.
  misreading: >-
    "ಎಂದಿಗೂ ಸಹಾಯ ಕೇಳಬೇಡ — ಒಬ್ಬನೇ ಮಾಡು" ಎಂದಲ್ಲ. ಗೀತೆಯೇ ಒಬ್ಬ ಮಾರ್ಗದರ್ಶಕನೊಂದಿಗಿನ
    ಸಂವಾದ. ಮೇಲೇಳುವ ನಿರ್ಧಾರ ನಿಮ್ಮದೇ ಆಗಿರಬೇಕು ಎಂಬುದೇ ಇಲ್ಲಿನ ಸಾರ.
  practice: >-
    ಇಂದು ನಿಮ್ಮ ಬಗ್ಗೆ ನೀವೇ ಹೇಳಿಕೊಳ್ಳುವ ಒಂದು ನಕಾರಾತ್ಮಕ ವಾಕ್ಯವನ್ನು ಹಿಡಿಯಿರಿ.
    ಅದನ್ನು ಒಬ್ಬ ಮಿತ್ರನ ಧ್ವನಿಯಲ್ಲಿ ಮರು-ಬರೆದು, ಗಟ್ಟಿಯಾಗಿ ಹೇಳಿ.
