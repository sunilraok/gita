ref: "12.13"
day: 18
theme: relationships
illustration: circle-of-care
related: ["17.15", "9.26", "2.56"]
sources:
  story:
    cite: Mahabharata, Mahaprasthanika Parva, Section 3 — K. M. Ganguli (trans.), 1883–96
    url: https://sacred-texts.com/hin/m17/m17003.htm
en:
  title: "Friendly and compassionate to all"
  essence: "Hate no one; be friendly and kind; drop 'mine' and 'I'; stay even and forgiving."
  meaning: >-
    One who hates no living being, who is friendly and compassionate, free
    from possessiveness and ego, even-minded in pain and pleasure, and
    forgiving — such a person is dear to me.
  student: >-
    Be the classmate who includes the new kid, shares notes, and doesn't join
    in mocking someone. Kindness in school is remembered for a lifetime —
    by both sides.
  home: >-
    Forgiveness (kṣamā) keeps families together. Holding on to "who was
    right" and "what is mine" slowly empties a home of warmth. Let small
    things go.
  work: >-
    Treat the security guard, the cleaner and the CEO with the same respect.
    Teams led by people without ego and with genuine care outperform teams
    run on fear.
  story:
    title: "Yudhishthira and the dog"
    source: "Mahabharata, Mahaprasthanika Parva"
    text: >-
      At the end of his life, Yudhishthira climbed the Himalayas; one by one
      his companions fell, until only a stray dog remained beside him. Indra
      arrived in a chariot to take him to heaven — but only him, not the dog.
      Yudhishthira refused: "I will not abandon one who is devoted to me and
      depends on me." The dog revealed himself as Dharma, and Yudhishthira was
      honoured for his compassion.
    connection: >-
      Friendliness to all beings is tested precisely when it costs us
      something.
  misreading: >-
    "Let people walk all over you." No — being without hatred does not mean
    being without boundaries. You can be firm and still wish everyone well.
  practice: >-
    Today, do one kind act for someone who cannot repay you — and don't tell
    anyone about it.
kn:
  title: "ಎಲ್ಲರಲ್ಲೂ ಮೈತ್ರಿ ಮತ್ತು ಕರುಣೆ"
  essence: "ಯಾರನ್ನೂ ದ್ವೇಷಿಸಬೇಡ; ಸ್ನೇಹ, ಕರುಣೆ ಇರಲಿ; 'ನನ್ನದು', 'ನಾನು' ಬಿಡು; ಸಮಚಿತ್ತ, ಕ್ಷಮಾಶೀಲನಾಗಿರು."
  meaning: >-
    ಯಾವ ಜೀವಿಯನ್ನೂ ದ್ವೇಷಿಸದವನು, ಮೈತ್ರಿ ಮತ್ತು ಕರುಣೆಯುಳ್ಳವನು, ಮಮಕಾರ ಮತ್ತು
    ಅಹಂಕಾರವಿಲ್ಲದವನು, ಸುಖ-ದುಃಖಗಳಲ್ಲಿ ಸಮನಾದವನು, ಕ್ಷಮಾಶೀಲನು — ಅಂಥವನು ನನಗೆ ಪ್ರಿಯ.
  student: >-
    ಹೊಸ ವಿದ್ಯಾರ್ಥಿಯನ್ನು ಸೇರಿಸಿಕೊಳ್ಳುವ, ನೋಟ್ಸ್ ಹಂಚಿಕೊಳ್ಳುವ, ಯಾರನ್ನಾದರೂ
    ಗೇಲಿಮಾಡುವುದರಲ್ಲಿ ಸೇರದ ಸಹಪಾಠಿಯಾಗಿ. ಶಾಲೆಯಲ್ಲಿನ ದಯೆ ಜೀವನಪರ್ಯಂತ ನೆನಪಿನಲ್ಲಿರುತ್ತದೆ —
    ಎರಡೂ ಕಡೆಯವರಿಗೆ.
  home: >-
    ಕ್ಷಮೆ ಕುಟುಂಬಗಳನ್ನು ಒಟ್ಟಿಗೆ ಇಡುತ್ತದೆ. "ಯಾರು ಸರಿ" ಮತ್ತು "ಯಾವುದು ನನ್ನದು" ಎಂಬುದನ್ನೇ
    ಹಿಡಿದುಕೊಂಡರೆ ಮನೆಯ ಬೆಚ್ಚನೆ ನಿಧಾನವಾಗಿ ಖಾಲಿಯಾಗುತ್ತದೆ. ಸಣ್ಣ ವಿಷಯಗಳನ್ನು ಬಿಟ್ಟುಬಿಡಿ.
  work: >-
    ಭದ್ರತಾ ಸಿಬ್ಬಂದಿ, ಸ್ವಚ್ಛತಾ ಕಾರ್ಮಿಕರು ಮತ್ತು ಸಿಇಒ — ಎಲ್ಲರನ್ನೂ ಒಂದೇ ಗೌರವದಿಂದ
    ನೋಡಿ. ಅಹಂಕಾರವಿಲ್ಲದ, ನಿಜವಾದ ಕಾಳಜಿಯುಳ್ಳ ನಾಯಕರ ತಂಡಗಳು ಭಯದಿಂದ ನಡೆಯುವ
    ತಂಡಗಳನ್ನು ಮೀರಿಸುತ್ತವೆ.
  story:
    title: "ಯುಧಿಷ್ಠಿರ ಮತ್ತು ನಾಯಿ"
    source: "ಮಹಾಭಾರತ, ಮಹಾಪ್ರಸ್ಥಾನಿಕ ಪರ್ವ"
    text: >-
      ಜೀವನದ ಕೊನೆಯಲ್ಲಿ ಯುಧಿಷ್ಠಿರ ಹಿಮಾಲಯವನ್ನು ಏರಿದನು; ಒಬ್ಬೊಬ್ಬರಾಗಿ ಅವನ ಜೊತೆಗಾರರು
      ಬಿದ್ದರು, ಕೊನೆಗೆ ಒಂದು ಬೀದಿನಾಯಿ ಮಾತ್ರ ಅವನೊಂದಿಗೆ ಉಳಿಯಿತು. ಇಂದ್ರ ರಥದಲ್ಲಿ ಬಂದು
      ಅವನನ್ನು ಸ್ವರ್ಗಕ್ಕೆ ಕರೆದೊಯ್ಯುವುದಾಗಿ ಹೇಳಿದ — ಅವನನ್ನು ಮಾತ್ರ, ನಾಯಿಯನ್ನಲ್ಲ.
      ಯುಧಿಷ್ಠಿರ ನಿರಾಕರಿಸಿದ: "ನನ್ನನ್ನು ನಂಬಿ ನನ್ನನ್ನೇ ಆಶ್ರಯಿಸಿದವನನ್ನು ನಾನು ಕೈಬಿಡುವುದಿಲ್ಲ."
      ನಾಯಿ ಧರ್ಮದೇವತೆಯಾಗಿ ತನ್ನನ್ನು ಪ್ರಕಟಪಡಿಸಿತು, ಯುಧಿಷ್ಠಿರನ ಕರುಣೆಗೆ ಗೌರವ ಸಂದಿತು.
    connection: >-
      ಎಲ್ಲಾ ಜೀವಿಗಳ ಮೇಲಿನ ಮೈತ್ರಿ ನಿಜವಾಗಿ ಪರೀಕ್ಷೆಗೊಳಗಾಗುವುದು ಅದಕ್ಕೆ ಬೆಲೆ ತೆರಬೇಕಾದಾಗಲೇ.
  misreading: >-
    "ಜನ ನಿಮ್ಮನ್ನು ತುಳಿಯಲು ಬಿಡಿ" ಎಂದಲ್ಲ. ದ್ವೇಷವಿಲ್ಲದಿರುವುದು ಎಂದರೆ ಮಿತಿಗಳಿಲ್ಲದಿರುವುದಲ್ಲ.
    ದೃಢವಾಗಿದ್ದೂ ಎಲ್ಲರಿಗೂ ಒಳಿತನ್ನು ಬಯಸಬಹುದು.
  practice: >-
    ಇಂದು ನಿಮಗೆ ಮರುಪಾವತಿ ಮಾಡಲಾಗದ ಯಾರಿಗಾದರೂ ಒಂದು ದಯೆಯ ಕೆಲಸ ಮಾಡಿ — ಯಾರಿಗೂ ಹೇಳಬೇಡಿ.
