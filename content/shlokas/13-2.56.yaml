ref: "2.56"
day: 13
theme: steady
illustration: rock-waves
related: ["2.48", "2.14", "2.62-63"]
sources:
  story:
    cite: Mahabharata, Shanti Parva 12.17.18–19 and 12.219 (critical edition numbering)
    url: https://www.wisdomlib.org/hinduism/book/mahabharata-sanskrit/d/doc1017040.html
en:
  title: "The person of steady wisdom"
  essence: "Not shaken by sorrow, not craving pleasure, free from clinging, fear and anger."
  meaning: >-
    One whose mind is not disturbed in sorrow, who does not crave pleasures,
    and who is free from attachment, fear and anger — such a sage is called
    one of steady wisdom (sthita-prajña).
  student: >-
    The calm student in the exam hall is not the one who studied least; it is
    the one who is not ruled by fear of failure or hunger for praise. That
    calm lets them recall what they know.
  home: >-
    In a family crisis, the person who stays calm — without panic or
    blame — helps everyone think clearly. Be that person for your family.
  work: >-
    In an outage, a lost client or a heated meeting, the steady mind asks,
    "What is true, and what is needed now?" instead of reacting from fear or
    anger. That is leadership, whatever your title.
  story:
    title: "King Janaka and the burning city"
    source: "Mahabharata, Shanti Parva"
    text: >-
      King Janaka of Mithila ruled a great kingdom yet lived as a sage. A
      famous saying is attributed to him: "If Mithila burns, nothing of mine
      burns." He cared for his people and ruled well — but his inner peace did
      not depend on his palace, his wealth or his fame.
    connection: >-
      Steady wisdom is not running away from responsibility. It is carrying
      responsibility without being owned by it.
  misreading: >-
    "A wise person doesn't care." No — the steady person cares deeply, but
    acts from clarity instead of panic, craving or rage.
  practice: >-
    Next time you feel upset today, silently name the feeling ("this is fear",
    "this is anger") before you speak. Naming it loosens its grip.
kn:
  title: "ಸ್ಥಿತಪ್ರಜ್ಞ — ಸ್ಥಿರ ಬುದ್ಧಿಯುಳ್ಳವನು"
  essence: "ದುಃಖದಲ್ಲಿ ಕಂಗೆಡದ, ಸುಖಕ್ಕೆ ಹಂಬಲಿಸದ, ರಾಗ-ಭಯ-ಕ್ರೋಧಗಳಿಲ್ಲದವನು."
  meaning: >-
    ದುಃಖಗಳಲ್ಲಿ ಉದ್ವೇಗಗೊಳ್ಳದ ಮನಸ್ಸುಳ್ಳವನು, ಸುಖಗಳಲ್ಲಿ ಆಸೆಯಿಲ್ಲದವನು, ರಾಗ, ಭಯ,
    ಕ್ರೋಧಗಳನ್ನು ತೊರೆದವನು — ಅಂಥ ಮುನಿಯನ್ನು ಸ್ಥಿತಪ್ರಜ್ಞ ಎನ್ನುತ್ತಾರೆ.
  student: >-
    ಪರೀಕ್ಷಾ ಕೊಠಡಿಯಲ್ಲಿ ಶಾಂತವಾಗಿರುವ ವಿದ್ಯಾರ್ಥಿ ಕಡಿಮೆ ಓದಿದವನಲ್ಲ; ಸೋಲಿನ ಭಯ ಅಥವಾ
    ಹೊಗಳಿಕೆಯ ಹಸಿವು ಆಳದವನು. ಆ ಶಾಂತಿಯೇ ತಿಳಿದದ್ದನ್ನು ನೆನಪಿಸಿಕೊಳ್ಳಲು ನೆರವಾಗುತ್ತದೆ.
  home: >-
    ಕುಟುಂಬದ ಬಿಕ್ಕಟ್ಟಿನಲ್ಲಿ, ಗಾಬರಿ ಅಥವಾ ದೂಷಣೆ ಇಲ್ಲದೆ ಶಾಂತವಾಗಿರುವವರು ಎಲ್ಲರೂ
    ಸ್ಪಷ್ಟವಾಗಿ ಯೋಚಿಸಲು ನೆರವಾಗುತ್ತಾರೆ. ನಿಮ್ಮ ಕುಟುಂಬಕ್ಕೆ ಆ ವ್ಯಕ್ತಿ ನೀವಾಗಿ.
  work: >-
    ವ್ಯವಸ್ಥೆ ಸ್ಥಗಿತ, ಕೈತಪ್ಪಿದ ಗ್ರಾಹಕ, ಬಿಸಿಬಿಸಿ ಸಭೆ — ಸ್ಥಿರ ಮನಸ್ಸು ಭಯ ಅಥವಾ ಕೋಪದಿಂದ
    ಪ್ರತಿಕ್ರಿಯಿಸುವ ಬದಲು "ನಿಜ ಏನು, ಈಗ ಏನು ಬೇಕು?" ಎಂದು ಕೇಳುತ್ತದೆ. ಹುದ್ದೆ ಯಾವುದೇ
    ಇರಲಿ, ಅದೇ ನಾಯಕತ್ವ.
  story:
    title: "ಜನಕ ಮಹಾರಾಜ ಮತ್ತು ಉರಿಯುವ ನಗರ"
    source: "ಮಹಾಭಾರತ, ಶಾಂತಿಪರ್ವ"
    text: >-
      ಮಿಥಿಲೆಯ ರಾಜ ಜನಕ ದೊಡ್ಡ ರಾಜ್ಯವನ್ನು ಆಳುತ್ತಿದ್ದರೂ ಋಷಿಯಂತೆ ಬದುಕಿದ. "ಮಿಥಿಲೆ
      ಉರಿದರೂ ನನ್ನದೇನೂ ಉರಿಯುವುದಿಲ್ಲ" ಎಂಬ ಪ್ರಸಿದ್ಧ ಮಾತು ಅವನದ್ದೆಂದು ಹೇಳಲಾಗುತ್ತದೆ.
      ಅವನು ಪ್ರಜೆಗಳನ್ನು ಕಾಳಜಿಯಿಂದ ಚೆನ್ನಾಗಿ ಆಳಿದ — ಆದರೆ ಅವನ ಆಂತರಿಕ ಶಾಂತಿ ಅರಮನೆ,
      ಸಂಪತ್ತು, ಕೀರ್ತಿಯ ಮೇಲೆ ಅವಲಂಬಿತವಾಗಿರಲಿಲ್ಲ.
    connection: >-
      ಸ್ಥಿತಪ್ರಜ್ಞತೆ ಎಂದರೆ ಜವಾಬ್ದಾರಿಯಿಂದ ಓಡಿಹೋಗುವುದಲ್ಲ. ಜವಾಬ್ದಾರಿಯನ್ನು ಹೊತ್ತರೂ
      ಅದಕ್ಕೆ ದಾಸರಾಗದಿರುವುದು.
  misreading: >-
    "ಜ್ಞಾನಿಗೆ ಕಾಳಜಿ ಇರುವುದಿಲ್ಲ" ಎಂದಲ್ಲ. ಸ್ಥಿರ ವ್ಯಕ್ತಿ ಆಳವಾಗಿ ಕಾಳಜಿ ವಹಿಸುತ್ತಾನೆ,
    ಆದರೆ ಗಾಬರಿ, ಹಂಬಲ ಅಥವಾ ಕೋಪದಿಂದಲ್ಲ, ಸ್ಪಷ್ಟತೆಯಿಂದ ಕಾರ್ಯ ಮಾಡುತ್ತಾನೆ.
  practice: >-
    ಇಂದು ಮುಂದಿನ ಬಾರಿ ಅಸಮಾಧಾನವಾದಾಗ, ಮಾತನಾಡುವ ಮೊದಲು ಆ ಭಾವನೆಗೆ ಮನಸ್ಸಿನಲ್ಲೇ ಹೆಸರಿಡಿ
    ("ಇದು ಭಯ", "ಇದು ಕೋಪ"). ಹೆಸರಿಟ್ಟರೆ ಅದರ ಹಿಡಿತ ಸಡಿಲವಾಗುತ್ತದೆ.
