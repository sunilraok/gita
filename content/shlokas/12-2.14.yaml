ref: "2.14"
day: 12
theme: steady
illustration: seasons-cycle
related: ["2.48", "2.56", "2.22"]
en:
  title: "This too will pass — endure it"
  essence: "Heat and cold, pleasure and pain come and go. Bear them patiently."
  meaning: >-
    The contact of the senses with their objects brings cold and heat,
    pleasure and pain. They come and go; they are not permanent. Learn to
    endure them patiently, O Bharata.
  student: >-
    Exam season, a breakup, being left out of a team — it feels permanent
    while it lasts. Remember last year's worst week? It passed. So will this.
    Keep doing the next right thing.
  home: >-
    Difficult phases — a new baby, an illness, a financial squeeze, a
    teenager's moods — are seasons, not the whole climate. Families that
    remember this are gentler with each other while going through them.
  work: >-
    Quarter-end crunch, a restructuring, a bad review — these are weather,
    not your career. Titiksha (patient endurance) keeps you from making
    permanent decisions based on temporary feelings.
  story:
    title: "Thirteen years of exile"
    source: "Mahabharata, Vana and Virata Parvas"
    text: >-
      After losing everything in a rigged game of dice, the Pandavas lived
      twelve years in the forest and a thirteenth year in disguise — a prince
      working as a cook, the greatest archer as a dance teacher, a queen as a
      maid. They endured insult, hunger and danger, using the time to learn,
      gather allies and grow. When the season passed, they returned stronger.
    connection: >-
      Endurance is not passive waiting. It is staying steady and useful while
      the hard season runs its course.
  misreading: >-
    "Silently suffer everything." No — endure what is passing and cannot be
    changed; act to change what can and should be changed.
  practice: >-
    Write down one thing troubling you now. Next to it write: "Temporary?" and
    one small step that will help you through it.
kn:
  title: "ಇದೂ ಕಳೆದುಹೋಗುತ್ತದೆ — ಸಹಿಸಿಕೊ"
  essence: "ಶೀತ-ಉಷ್ಣ, ಸುಖ-ದುಃಖ ಬರುತ್ತವೆ, ಹೋಗುತ್ತವೆ. ತಾಳ್ಮೆಯಿಂದ ಸಹಿಸು."
  meaning: >-
    ಇಂದ್ರಿಯಗಳು ವಿಷಯಗಳೊಂದಿಗೆ ಸೇರಿದಾಗ ಶೀತ-ಉಷ್ಣ, ಸುಖ-ದುಃಖಗಳು ಉಂಟಾಗುತ್ತವೆ. ಅವು
    ಬಂದು ಹೋಗುವಂಥವು, ಅನಿತ್ಯ. ಓ ಭಾರತ, ಅವನ್ನು ತಾಳ್ಮೆಯಿಂದ ಸಹಿಸಿಕೊ.
  student: >-
    ಪರೀಕ್ಷೆಯ ಕಾಲ, ಸ್ನೇಹ ಮುರಿದದ್ದು, ತಂಡದಿಂದ ಹೊರಗುಳಿದದ್ದು — ಅದು ಇರುವಷ್ಟು ಕಾಲ
    ಶಾಶ್ವತವೆನಿಸುತ್ತದೆ. ಕಳೆದ ವರ್ಷದ ಅತ್ಯಂತ ಕೆಟ್ಟ ವಾರ ನೆನಪಿದೆಯೇ? ಅದು ಕಳೆಯಿತು. ಇದೂ
    ಕಳೆಯುತ್ತದೆ. ಮುಂದಿನ ಸರಿಯಾದ ಕೆಲಸವನ್ನು ಮಾಡುತ್ತಿರಿ.
  home: >-
    ಕಷ್ಟದ ಹಂತಗಳು — ಹೊಸ ಮಗು, ಅನಾರೋಗ್ಯ, ಹಣಕಾಸಿನ ಬಿಕ್ಕಟ್ಟು, ಹದಿಹರೆಯದವರ ಮನಸ್ಥಿತಿ —
    ಇವು ಋತುಗಳು, ಇಡೀ ಹವಾಮಾನವಲ್ಲ. ಇದನ್ನು ನೆನಪಿಡುವ ಕುಟುಂಬಗಳು ಆ ಕಾಲದಲ್ಲಿ ಪರಸ್ಪರ
    ಹೆಚ್ಚು ಮೃದುವಾಗಿರುತ್ತವೆ.
  work: >-
    ತ್ರೈಮಾಸಿಕದ ಒತ್ತಡ, ಪುನರ್‌ರಚನೆ, ಕೆಟ್ಟ ಮೌಲ್ಯಮಾಪನ — ಇವು ಹವಾಮಾನ, ನಿಮ್ಮ ಇಡೀ
    ವೃತ್ತಿಜೀವನವಲ್ಲ. ತಿತಿಕ್ಷೆ (ತಾಳ್ಮೆಯ ಸಹನೆ) ತಾತ್ಕಾಲಿಕ ಭಾವನೆಗಳ ಆಧಾರದ ಮೇಲೆ
    ಶಾಶ್ವತ ನಿರ್ಧಾರ ಮಾಡುವುದರಿಂದ ನಿಮ್ಮನ್ನು ತಡೆಯುತ್ತದೆ.
  story:
    title: "ಹದಿಮೂರು ವರ್ಷದ ವನವಾಸ"
    source: "ಮಹಾಭಾರತ, ವನಪರ್ವ ಮತ್ತು ವಿರಾಟಪರ್ವ"
    text: >-
      ಮೋಸದ ಪಗಡೆಯಾಟದಲ್ಲಿ ಎಲ್ಲವನ್ನೂ ಕಳೆದುಕೊಂಡ ಪಾಂಡವರು ಹನ್ನೆರಡು ವರ್ಷ ಕಾಡಿನಲ್ಲಿ,
      ಹದಿಮೂರನೆಯ ವರ್ಷ ಅಜ್ಞಾತವಾಸದಲ್ಲಿ ಕಳೆದರು — ರಾಜಕುಮಾರ ಅಡುಗೆಯವನಾಗಿ, ಶ್ರೇಷ್ಠ
      ಬಿಲ್ಲುಗಾರ ನೃತ್ಯ ಶಿಕ್ಷಕನಾಗಿ, ರಾಣಿ ದಾಸಿಯಾಗಿ. ಅವಮಾನ, ಹಸಿವು, ಅಪಾಯಗಳನ್ನು ಸಹಿಸಿ,
      ಆ ಕಾಲವನ್ನು ಕಲಿಯಲು, ಮಿತ್ರರನ್ನು ಗಳಿಸಲು, ಬೆಳೆಯಲು ಬಳಸಿಕೊಂಡರು. ಆ ಋತು ಕಳೆದಾಗ
      ಅವರು ಇನ್ನಷ್ಟು ಬಲಶಾಲಿಗಳಾಗಿ ಮರಳಿದರು.
    connection: >-
      ಸಹನೆ ಎಂದರೆ ನಿಷ್ಕ್ರಿಯವಾಗಿ ಕಾಯುವುದಲ್ಲ. ಕಷ್ಟದ ಕಾಲ ಸಾಗುವವರೆಗೆ ಸ್ಥಿರವಾಗಿ,
      ಉಪಯುಕ್ತವಾಗಿ ಇರುವುದು.
  misreading: >-
    "ಎಲ್ಲವನ್ನೂ ಮೌನವಾಗಿ ಸಹಿಸು" ಎಂದಲ್ಲ. ಬದಲಿಸಲಾಗದ, ಕಳೆದುಹೋಗುವುದನ್ನು ಸಹಿಸಿ;
    ಬದಲಿಸಬಹುದಾದ ಮತ್ತು ಬದಲಿಸಬೇಕಾದುದನ್ನು ಬದಲಿಸಲು ಕ್ರಮ ಕೈಗೊಳ್ಳಿ.
  practice: >-
    ಈಗ ನಿಮ್ಮನ್ನು ಕಾಡುತ್ತಿರುವ ಒಂದು ವಿಷಯವನ್ನು ಬರೆಯಿರಿ. ಅದರ ಪಕ್ಕದಲ್ಲಿ "ತಾತ್ಕಾಲಿಕವೇ?"
    ಎಂದು ಬರೆದು, ಅದನ್ನು ದಾಟಲು ನೆರವಾಗುವ ಒಂದು ಸಣ್ಣ ಹೆಜ್ಜೆಯನ್ನು ಬರೆಯಿರಿ.
